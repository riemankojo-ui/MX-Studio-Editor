<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MX Studio · Photos</title>
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Audiowide&family=Alfa+Slab+One&family=Bebas+Neue&family=Black+Ops+One&family=Bungee&family=Bungee+Inline&family=Chango&family=Chewy&family=Cinzel:wght@700&family=Coiny&family=Creepster&family=Damion&family=Dancing+Script:wght@700&family=Diplomata+SC&family=Frijole&family=Gloria+Hallelujah&family=Great+Vibes&family=Gugi&family=Knewave&family=Lobster&family=Luckiest+Guy&family=Merriweather:wght@700&family=Monoton&family=Montserrat:wght@800&family=Orbitron:wght@900&family=Oswald:wght@700&family=Pacifico&family=Parisienne&family=Permanent+Marker&family=Playfair+Display:wght@700&family=Poppins:wght@700&family=Press+Start+2P&family=Righteous&family=Russo+One&family=Rye&family=Satisfy&family=Special+Elite&family=Yellowtail&display=swap" rel="stylesheet">
<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body {
  height: 100vh; width: 100%;
  overflow: hidden; overscroll-behavior: none;
  position: fixed; top: 0; left: 0;
  margin: 0; padding: 0;
  background:#0a0a0a; color:#fff;
  font-family:sans-serif; text-align:center;
  touch-action: manipulation;
}
.view { display: none; }
.view.active { display: flex; flex-direction: column; height: 100vh; padding: 8px 8px 78px 8px; overflow: hidden; }
.home-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px; max-width: 600px; margin: 0 auto; width: 100%; }
.gallery { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
.gal-item { position:relative; aspect-ratio:1 / 1; border-radius:6px; overflow:hidden; background:#141414; cursor:pointer; }
.gal-item img { width:100%; height:100%; object-fit:cover; display:block; }
.gal-del { position:absolute; top:4px; right:4px; width:22px; height:22px; background:rgba(255,44,44,.92); border:none; border-radius:50%; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.gal-del svg { stroke:#fff; }
.gal-add { display:flex; align-items:center; justify-content:center; background:transparent; border:1px dashed #2a2a2a; border-radius:6px; aspect-ratio:1 / 1; color:#444; cursor:pointer; }
.gal-add:active { border-color:#fff; color:#fff; }
.gal-empty { grid-column:1 / -1; text-align:center; color:#444; font-size:11px; padding:20px 0; }

.canvas-container { position:relative; display:inline-block; max-width:100%; margin: 0 auto 4px auto; flex-shrink: 0; }
canvas { max-width:100%; max-height: 56vh; height:auto; width:auto; background:#000; cursor:move; touch-action:none; display:block; }

#cropOverlay { position:absolute; inset:0; display:none; z-index:40; pointer-events:none; }
#cropOverlay.active { display:block; pointer-events:auto; }
#cropBox { position:absolute; border:2px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,0.7); cursor:move; touch-action:none; pointer-events:auto; }
.crop-corner { position:absolute; width:32px; height:32px; background:#fff; border-radius:50%; box-shadow:0 0 10px rgba(0,0,0,.7); touch-action:none; pointer-events:auto; }
.crop-corner[data-corner="tl"] { top:-16px; left:-16px; cursor:nwse-resize; }
.crop-corner[data-corner="tr"] { top:-16px; right:-16px; cursor:nesw-resize; }
.crop-corner[data-corner="bl"] { bottom:-16px; left:-16px; cursor:nesw-resize; }
.crop-corner[data-corner="br"] { bottom:-16px; right:-16px; cursor:nwse-resize; }

#textFloatingMenu { display:none; position:absolute; background:rgba(15,15,15,.96); padding:8px; border-radius:10px; z-index:50; transform:translate(-50%,-125%); width:150px; }
.arrow-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:6px; }
.arrow-btn { background:#1a1a1a; color:#fff; border:none; padding:6px 0; border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.arrow-btn svg { stroke:#fff; }
.arrow-btn:active { background:#444; }
.menu-actions { display:flex; justify-content:space-between; gap:4px; }
.menu-action-btn { background:#222; color:#fff; border:none; padding:5px 6px; border-radius:4px; font-size:10px; font-weight:bold; cursor:pointer; flex:1; }
.menu-action-btn.delete { background:#ff2c2c; } .menu-action-btn.center-btn { background:#333; }

.top-bar { display:flex; justify-content:space-between; align-items:center; padding:6px 4px; margin-bottom:4px; gap:6px; flex-shrink: 0; }
.top-tools { display:flex; gap:4px; align-items:center; }
.icon-btn { background:none; border:none; color:#fff; cursor:pointer; padding:8px; display:inline-flex; }
.icon-btn svg { stroke:currentColor; width:24px; height:24px; }
.icon-btn:disabled { color:#333; cursor:not-allowed; }
.icon-action { background:none; border:none; color:#fff; cursor:pointer; padding:6px; display:inline-flex; }
.icon-action svg { stroke:#fff; }

.bottom-nav { display:flex; justify-content:flex-start; align-items:stretch; background:#050505; border-top:1px solid #1a1a1a; padding:6px 0 8px; position:fixed; bottom:0; left:0; width:100%; z-index:100; overflow-x:auto; }
.bottom-nav::-webkit-scrollbar { display:none; }
.bottom-nav { scrollbar-width:none; }
.nav-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; flex:1 0 56px; background:none; border:none; color:#555; font-size:7px; font-weight:bold; cursor:pointer; padding:2px; letter-spacing:.1px; text-transform:uppercase; }
.nav-btn svg { stroke:currentColor; }
.nav-btn.active { color:#fff; } .nav-btn.active svg { stroke:#fff; }

.panel { display: none; background: transparent; padding:10px 2px; text-align:left; font-size:12px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
.panel.active { display: block; animation: slideUp 0.22s ease; }
@keyframes slideUp { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.sub-tabs { display:flex; justify-content:center; gap:14px; margin-bottom:10px; border-bottom:1px solid #1a1a1a; padding-bottom:6px; flex-wrap:wrap; }
.sub-tab { background:none; border:none; color:#666; font-weight:bold; font-size:11px; cursor:pointer; padding:2px 0; }
.sub-tab.active { color:#fff; border-bottom:2px solid #fff; }
.sub-view { display:none; } .sub-view.active { display:block; }

.adjust-sliders { display:flex; flex-direction:column; gap:14px; padding:6px 4px; }
input[type="range"] { -webkit-appearance:none; appearance:none; width:100%; height:3px; background:#242424; border-radius:2px; outline:none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; background:#fff; border-radius:50%; cursor:pointer; }
input[type="range"]::-moz-range-thumb { width:18px; height:18px; background:#fff; border-radius:50%; cursor:pointer; border:none; }
input[type="range"] { accent-color:#fff; }

.h-scroll, .filter-thumbs, .template-thumbs, .border-thumbs, .color-row, .bgcolor-row {
  display:flex; gap:6px; overflow-x:auto; padding:4px 2px 8px;
  -webkit-overflow-scrolling:touch;
}
.h-scroll::-webkit-scrollbar, .filter-thumbs::-webkit-scrollbar, .template-thumbs::-webkit-scrollbar, .border-thumbs::-webkit-scrollbar, .color-row::-webkit-scrollbar, .bgcolor-row::-webkit-scrollbar { display: none; }
.h-scroll, .filter-thumbs, .template-thumbs, .border-thumbs, .color-row, .bgcolor-row { scrollbar-width: none; }

.h-card { flex:0 0 auto; padding:7px 14px; background:#161616; border:none; border-radius:16px; font-size:11px; font-weight:600; color:#aaa; cursor:pointer; white-space:nowrap; }
.h-card.selected { color:#fff; background:#333; }

.template-thumb { flex:0 0 auto; width:60px; cursor:pointer; text-align:center; }
.template-thumb-img { width:60px; height:74px; border-radius:6px; background-size:cover; background-position:center; background-color:#111; }
.template-thumb.selected .template-thumb-img { box-shadow:0 0 0 2px #fff; }
.template-thumb-label { font-size:9px; color:#888; margin-top:3px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
.template-thumb.selected .template-thumb-label { color:#fff; }

.filter-thumb { flex:0 0 auto; width:58px; cursor:pointer; text-align:center; }
.filter-thumb-img { width:58px; height:58px; border-radius:6px; background-size:cover; background-position:center; background-color:#111; }
.filter-thumb.selected .filter-thumb-img { box-shadow:0 0 0 2px #fff; }
.filter-thumb-label { font-size:9px; color:#888; margin-top:3px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.filter-thumb.selected .filter-thumb-label { color:#fff; }
.filter-empty { color:#444; font-size:11px; padding:14px 8px; }

.border-thumb { flex:0 0 auto; width:52px; cursor:pointer; text-align:center; }
.border-thumb-img { width:52px; height:52px; border-radius:6px; background:#111; position:relative; overflow:hidden; }
.border-thumb.selected .border-thumb-img { box-shadow:0 0 0 2px #fff; }
.border-thumb-label { font-size:9px; color:#888; margin-top:3px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.border-thumb.selected .border-thumb-label { color:#fff; }
.bt-inner { position:absolute; inset:0; background:#333; }

.bcolor-circle { width:32px; height:32px; border-radius:50%; cursor:pointer; flex-shrink:0; border:2px solid #333; }
.bcolor-circle.selected { box-shadow:0 0 0 2px #fff; }

.color-circle { width:32px; height:32px; border-radius:50%; cursor:pointer; flex-shrink:0; border:2px solid #333; }
.color-circle.selected { box-shadow:0 0 0 2px #fff; }

.font-grid { display:flex; flex-wrap:wrap; gap:6px; max-height:170px; overflow-y:auto; }
.font-pill { background:#161616; border:none; color:#fff; padding:6px 10px; border-radius:14px; cursor:pointer; font-size:11px; font-weight:bold; white-space:nowrap; }
.font-pill.selected { background:#333; color:#fff; }

.text-layers-list { max-height:110px; overflow-y:auto; margin-bottom:8px; }
.text-layer-item { display:flex; justify-content:space-between; align-items:center; background:#141414; padding:6px 8px; border-radius:4px; margin-bottom:4px; }
.text-layer-item.active { background:#333; }

.add-text-btn {
  background:#fff; color:#000; border:none;
  padding:14px; width:100%; border-radius:8px;
  font-weight:bold; cursor:pointer; font-size:15px;
  margin-top:8px; letter-spacing:1px;
  display:flex; align-items:center; justify-content:center; gap:6px;
}

input[type="text"] { color:#fff; font-size:12px; width:100%; box-sizing:border-box; padding:9px; background:#141414; border:none; border-radius:6px; margin-top:4px; }

.section-label { font-size:10px; color:#666; margin:8px 0 2px; display:block; letter-spacing:.5px; }

.crop-toolbar { display:flex; gap:6px; padding:8px 4px; justify-content:center; flex-wrap:wrap; }
.crop-tool { background:#161616; color:#ccc; border:none; padding:9px 14px; border-radius:20px; font-size:11px; font-weight:bold; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
.crop-tool.active { background:#fff; color:#000; }
.crop-tool svg { stroke:currentColor; width:14px; height:14px; }

.bgcolor-row { display:flex; flex-wrap:wrap; gap:10px; padding:8px 4px; overflow:visible !important; }
.bgcolor-swatch {
  width:64px; height:64px; border-radius:12px;
  cursor:pointer; position:relative;
  border:2px solid #333;
}
.bgcolor-swatch.selected { border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.4); }

#aiPanel { display:none; position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:9999; align-items:center; justify-content:center; padding:16px; }
.ai-card { background:#111; border-radius:12px; padding:18px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto; }
.ai-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.ai-title { color:#fff; letter-spacing:2px; font-size:13px; font-weight:bold; margin:0; }
.ai-input { width:100%; padding:12px; background:#0a0a0a; border:none; border-radius:8px; color:#fff; font-size:13px; outline:none; box-sizing:border-box; margin-bottom:10px; }
.ai-btn { width:100%; padding:12px; background:#fff; color:#000; border:none; border-radius:8px; font-weight:bold; font-size:13px; cursor:pointer; }
.ai-btn:disabled { opacity:.5; }
.ai-status { text-align:center; color:#666; font-size:12px; margin-top:10px; }
.spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.15); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="view-home" class="view active">
  <div class="home-container">
    <div id="gallery" class="gallery"></div>
  </div>
  <input type="file" id="homeImageUpload" accept="image/*" multiple style="display:none;">
</div>

<div id="view-studio" class="view">
  <div class="top-bar">
    <div class="top-tools">
      <button class="icon-btn" id="undoBtn" onclick="undo()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6.36 2.64L3 13"/></svg>
      </button>
      <button class="icon-btn" id="redoBtn" onclick="redo()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016.36 2.64L21 13"/></svg>
      </button>
    </div>
    <div style="display:flex;gap:4px;align-items:center;">
      <button class="icon-action" onclick="resetEverything()" title="Reset all">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M3 8a9 9 0 1017 5"/></svg>
      </button>
      <button class="icon-action" onclick="saveProjectToHome()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>
      <button class="icon-action" onclick="saveImage()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="cropOverlay">
      <div id="cropBox">
        <div class="crop-corner" data-corner="tl"></div>
        <div class="crop-corner" data-corner="tr"></div>
        <div class="crop-corner" data-corner="bl"></div>
        <div class="crop-corner" data-corner="br"></div>
      </div>
    </div>
    <div id="textFloatingMenu">
      <div class="arrow-grid">
        <div></div>
        <button class="arrow-btn" onclick="moveActiveText(0,-5)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        <div></div>
        <button class="arrow-btn" onclick="moveActiveText(-5,0)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <button class="arrow-btn" onclick="centerActiveTextHoriz()"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg></button>
        <button class="arrow-btn" onclick="moveActiveText(5,0)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
        <div></div>
        <button class="arrow-btn" onclick="moveActiveText(0,5)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>
        <div></div>
      </div>
      <div class="menu-actions">
        <button class="menu-action-btn center-btn" onclick="centerActiveTextHoriz()">Center</button>
        <button class="menu-action-btn delete" onclick="deleteActiveTextLayer()">Delete</button>
      </div>
    </div>
  </div>

  <div id="panel-adjust" class="panel active">
    <label class="section-label" style="margin-top:0;">TEMPLATES</label>
    <div class="template-thumbs" id="templateContainer"></div>
    <label class="section-label">FINE TUNE</label>
    <div class="adjust-sliders">
      <input type="range" id="brightness" min="0" max="200" value="100">
      <input type="range" id="contrast" min="50" max="200" value="100">
      <input type="range" id="saturation" min="0" max="200" value="100">
      <input type="range" id="noise" min="0" max="100" value="0">
    </div>
  </div>

  <div id="panel-crop" class="panel">
    <label class="section-label" style="margin-top:0;">DRAG CORNERS TO CROP · TAP APPLY</label>
    <div class="crop-toolbar">
      <button class="crop-tool" onclick="setCropRect('free')">FREE</button>
      <button class="crop-tool" onclick="setCropRect('1:1')">1:1</button>
      <button class="crop-tool" onclick="setCropRect('4:5')">4:5</button>
      <button class="crop-tool" onclick="setCropRect('9:16')">9:16</button>
      <button class="crop-tool" onclick="setCropRect('16:9')">16:9</button>
    </div>
    <div class="crop-toolbar">
      <button class="crop-tool" onclick="rotateImage(90)">↻ Rotate</button>
      <button class="crop-tool" onclick="flipImage('h')">⇋ Flip H</button>
      <button class="crop-tool" onclick="flipImage('v')">⇅ Flip V</button>
    </div>
    <div class="crop-toolbar">
      <button class="crop-tool" onclick="resetCrop()">RESET</button>
      <button class="crop-tool" onclick="applyCropNow()" style="background:#ff2c2c;color:#fff;flex:1;justify-content:center;">✂ APPLY CROP</button>
    </div>
  </div>

  <div id="panel-filters" class="panel">
    <div class="filter-thumbs" id="filterThumbsContainer" style="margin-top:8px;"></div>
  </div>

  <div id="panel-text" class="panel">
    <div class="sub-tabs">
      <button class="sub-tab active" onclick="switchSubTab('layers', this)">TEXT</button>
      <button class="sub-tab" onclick="switchSubTab('font', this)">FONTS</button>
      <button class="sub-tab" onclick="switchSubTab('basic', this)">STYLE</button>
      <button class="sub-tab" onclick="switchSubTab('featured', this)">EFFECTS</button>
    </div>
    <div id="subtab-layers" class="sub-view active">
      <input type="text" id="textContent" placeholder="Type here..." oninput="updateActiveTextContent(this.value)">
      <div id="textLayersList" class="text-layers-list"></div>
      <button class="add-text-btn" onclick="addNewTextLayer()">+ ADD TEXT</button>
      <div style="font-size:9px;color:#555;text-align:center;margin-top:8px;line-height:1.5;">
        Drag with 1 finger · Pinch with 2 fingers to resize & rotate
      </div>
    </div>
    <div id="subtab-font" class="sub-view">
      <label style="margin:0 0 2px;">Select Font (40):</label>
      <div class="font-grid" id="fontGridContainer"></div>
    </div>
    <div id="subtab-basic" class="sub-view">
      <label style="margin:0 0 2px;">Text Color:</label>
      <div class="color-row">
        <div class="color-circle" style="background:#ffffff;" onclick="setActiveTextColor('#ffffff',this)"></div>
        <div class="color-circle" style="background:#ff2c2c;" onclick="setActiveTextColor('#ff2c2c',this)"></div>
        <div class="color-circle" style="background:#000000;" onclick="setActiveTextColor('#000000',this)"></div>
      </div>
      <label style="margin-top:6px;display:block;">Font Size: <span id="fSizeVal">36</span>px</label>
      <input type="range" id="fontSize" min="8" max="300" value="36" oninput="setActiveFontSize(this.value)">
      <button class="crop-tool" onclick="deleteActiveTextLayer()" style="margin-top:10px;width:100%;justify-content:center;">DELETE THIS LAYER</button>
    </div>
    <div id="subtab-featured" class="sub-view">
      <div class="h-scroll">
        <div class="h-card selected" onclick="setActiveTextStyle('normal', this)">Standard</div>
        <div class="h-card" onclick="setActiveTextStyle('stroke', this)">Outline</div>
        <div class="h-card" onclick="setActiveTextStyle('shadow', this)">Shadow</div>
        <div class="h-card" onclick="setActiveTextStyle('glow', this)">Glow</div>
      </div>
    </div>
  </div>

  <div id="panel-color" class="panel">
    <label class="section-label" style="margin-top:0;">BACKGROUND COLOR</label>
    <div class="bgcolor-row" id="bgColorRow"></div>
    <label class="section-label" style="margin-top:6px;">FRAME SIZE: <span id="bgColorSizeVal">8</span>%</label>
    <input type="range" id="bgColorSizeInput" min="1" max="30" value="8" oninput="setBgColorSize(this.value)">
  </div>

  <div id="panel-bg" class="panel">
    <div id="subjectStatus" style="font-size:10px;color:#666;margin-bottom:8px;line-height:1.4;">Tap DETECT SUBJECT. First run downloads a small model (5-15 sec).</div>
    <button id="detectBtn" onclick="detectSubject()" style="background:#fff;color:#000;border:none;padding:10px;width:100%;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer;">DETECT SUBJECT</button>
    <label class="section-label">Effect</label>
    <div class="h-scroll">
      <div class="h-card selected" onclick="setSubjectMode('none', this)">None</div>
      <div class="h-card" onclick="setSubjectMode('blur', this)">BG Blur</div>
      <div class="h-card" onclick="setSubjectMode('stroke', this)">Stroke</div>
    </div>
    <label class="section-label">Amount: <span id="subjectAmtVal">12</span></label>
    <input type="range" id="subjectAmount" min="1" max="25" value="12">
  </div>

  <div id="panel-border" class="panel">
    <label class="section-label" style="margin-top:0;">FRAME STYLE</label>
    <div class="border-thumbs" id="borderContainer"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const textMenu = document.getElementById('textFloatingMenu');

let img = new Image();
let imgLoaded = false;
let originalImageSrc = null;

let currentFilter = 'none';
let currentBorder = 'none';
let currentBorderColor = '#ffffff';
let currentBorderSize = 5;
let currentTemplate = 'none';
let currentBgColor = null;
let currentBgColorSize = 8;
let currentProjectId = null;

const BG_COLORS = ['#ffffff', '#ff2c2c', '#000000'];

const TEMPLATES = [
  { name: 'None',       b: 100, c: 100, s: 100, n: 0,  f: 'none' },
  { name: 'Fresh',      b: 106, c: 104, s: 112, n: 0,  f: 'none' },
  { name: 'Euro',       b: 98,  c: 108, s: 92,  n: 12, f: 'sepia(22%)' },
  { name: 'Portrait',   b: 108, c: 96,  s: 112, n: 6,  f: 'none' },
  { name: 'Moody',      b: 90,  c: 125, s: 90,  n: 8,  f: 'none' },
  { name: 'Cinematic',  b: 96,  c: 118, s: 95,  n: 6,  f: 'hue-rotate(-6deg) saturate(95%)' },
  { name: 'Summer',     b: 108, c: 108, s: 128, n: 0,  f: 'saturate(120%)' },
  { name: 'Mono',       b: 100, c: 118, s: 0,   n: 0,  f: 'grayscale(100%)' },
  { name: 'Noir',       b: 92,  c: 150, s: 0,   n: 14, f: 'grayscale(100%) contrast(140%)' },
  { name: 'Golden',     b: 106, c: 106, s: 116, n: 12, f: 'sepia(30%) saturate(120%)' }
];

const FILTERS = [
  { name: 'Normal',     code: 'none' },
  { name: 'Mono',       code: 'grayscale(100%) contrast(140%)' },
  { name: 'Vintage',    code: 'sepia(80%) contrast(130%)' },
  { name: 'Cyber',      code: 'invert(15%) hue-rotate(180deg)' },
  { name: 'Neon',       code: 'hue-rotate(90deg) saturate(150%)' },
  { name: 'Velvet',     code: 'hue-rotate(270deg) saturate(140%)' }
];

const BORDERS = [
  { name: 'None',     code: 'none' },
  { name: 'Frame',    code: 'white' },
  { name: 'Thick',    code: 'black' },
  { name: 'Rounded',  code: 'rounded' },
  { name: 'Polaroid', code: 'polaroid' },
  { name: 'Shadow',   code: 'shadow' }
];

let subjectMode = 'none';
let strokeColor = '#ffffff';
let personMask = null;
let subjectReady = false;
let selfieSeg = null;

let crop = { x: 0, y: 0, w: 1, h: 1 };
let cropDrag = null;

const fontList = [
  "Impact","Bebas Neue","Oswald","Montserrat","Anton","Pacifico","Permanent Marker",
  "Russo One","Press Start 2P","Righteous","Orbitron","Bungee","Bungee Inline",
  "Creepster","Monoton","Luckiest Guy","Rye","Satisfy","Yellowtail","Chewy",
  "Alfa Slab One","Cinzel","Audiowide","Black Ops One","Chango","Coiny","Damion",
  "Diplomata SC","Frijole","Gloria Hallelujah","Gugi","Knewave","Lobster",
  "Parisienne","Poppins","Playfair Display","Special Elite","Great Vibes",
  "Merriweather","Dancing Script"
];

let textLayers = [];
let activeLayerId = null;

let fxX = 200, fxY = 200;
let isDraggingText = false;
let isDraggingFx = false;
let undoStack = [], redoStack = [];

let touches = new Map();
let gesture = null;

const bInput = document.getElementById('brightness');
const cInput = document.getElementById('contrast');
const sInput = document.getElementById('saturation');
const nInput = document.getElementById('noise');
const subjAmt = document.getElementById('subjectAmount');
const tInput = document.getElementById('textContent');
const sizeInput = document.getElementById('fontSize');
const bgColorSizeInput = document.getElementById('bgColorSizeInput');

window.onload = function() {
  buildFontGrid();
  buildTemplates();
  buildBorders();
  buildBgColors();
  renderProjectsList();
  updateTextLayersUI();
  initCropOverlay();
  initHomeUpload();
};

function buildFontGrid() {
  const c = document.getElementById('fontGridContainer');
  let html = '';
  fontList.forEach(f => {
    const sel = (f === 'Impact') ? 'selected' : '';
    html += `<div class="font-pill ${sel}" style="font-family:'${f}',sans-serif" onclick="setActiveFont('${f}', this)">${f}</div>`;
  });
  c.innerHTML = html;
}

function buildBgColors() {
  const c = document.getElementById('bgColorRow');
  if (!c) return;
  let html = '';
  BG_COLORS.forEach(col => {
    const isSel = (currentBgColor === col);
    const sel = isSel ? 'selected' : '';
    html += `<div class="bgcolor-swatch ${sel}" style="background:${col};" onclick="setBgColor('${col}', this)"></div>`;
  });
  c.innerHTML = html;
}

function setBgColor(color, el) {
  currentBgColor = color;
  document.querySelectorAll('.bgcolor-swatch').forEach(s => s.classList.remove('selected'));
  if (el) el.classList.add('selected');
  redraw();
  saveState();
}

function setBgColorSize(v) {
  currentBgColorSize = parseInt(v);
  document.getElementById('bgColorSizeVal').innerText = v;
  redraw();
  saveState();
}

function buildTemplates() {
  const c = document.getElementById('templateContainer');
  if (!c) return;
  if (!imgLoaded || !img.src) { c.innerHTML = '<div class="filter-empty">Load a photo to see templates</div>'; return; }
  const src = img.src;
  let html = '';
  TEMPLATES.forEach((t, i) => {
    const isSel = (currentTemplate === t.name);
    const sel = isSel ? 'selected' : '';
    const filterStyle = `brightness(${t.b}%) contrast(${t.c}%) saturate(${t.s}%) ${t.f !== 'none' ? t.f : ''}`;
    html += `<div class="template-thumb ${sel}" onclick="applyTemplate(${i}, this)">
      <div class="template-thumb-img" style="background-image:url('${src}'); filter:${filterStyle};"></div>
      <span class="template-thumb-label">${t.name}</span>
    </div>`;
  });
  c.innerHTML = html;
}

function applyTemplate(i, el) {
  const t = TEMPLATES[i];
  if (!t) return;
  bInput.value = t.b; cInput.value = t.c; sInput.value = t.s; nInput.value = t.n;
  currentFilter = t.f;
  currentTemplate = t.name;
  el.parentElement.querySelectorAll('.template-thumb').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  buildFilterThumbs();
  redraw(); saveState();
}

function buildBorders() {
  const c = document.getElementById('borderContainer');
  if (!c) return;
  let html = '';
  BORDERS.forEach((b) => {
    const sel = (currentBorder === b.code) ? 'selected' : '';
    const preview = borderPreviewHTML(b.code);
    html += `<div class="border-thumb ${sel}" onclick="setBorder('${b.code}', this)">
      <div class="border-thumb-img">${preview}</div>
      <span class="border-thumb-label">${b.name}</span>
    </div>`;
  });
  c.innerHTML = html;
}

function borderPreviewHTML(code) {
  const col = currentBorderColor;
  if (code === 'none') return '<div class="bt-inner"></div>';
  if (code === 'white') return `<div class="bt-inner"></div><div style="position:absolute;inset:0;border:5px solid ${col};box-sizing:border-box;"></div>`;
  if (code === 'black') return `<div class="bt-inner"></div><div style="position:absolute;inset:0;border:8px solid ${col};box-sizing:border-box;"></div>`;
  if (code === 'rounded') return `<div class="bt-inner"></div><div style="position:absolute;inset:3px;border:4px solid ${col};border-radius:10px;box-sizing:border-box;"></div>`;
  if (code === 'polaroid') return `<div class="bt-inner" style="inset:0 0 14px 0;"></div><div style="position:absolute;inset:0;border:4px solid ${col};border-bottom-width:12px;box-sizing:border-box;"></div>`;
  if (code === 'shadow') return `<div class="bt-inner"></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(0,0,0,.85) 100%);"></div>`;
  return '<div class="bt-inner"></div>';
}

function setBorder(code, el) {
  currentBorder = code;
  el.parentElement.querySelectorAll('.border-thumb').forEach(t => t.classList.remove('selected'));
  el.classList.add('selected');
  redraw(); saveState();
}

function setBorderColor(color, el) {
  currentBorderColor = color;
  if (el) {
    el.parentElement.querySelectorAll('.bcolor-circle').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
  }
  buildBorders();
  redraw(); saveState();
}

function setBorderSize(v) {
  currentBorderSize = parseInt(v);
  document.getElementById('borderSizeVal').innerText = v;
  redraw(); saveState();
}

function buildFilterThumbs() {
  const el = document.getElementById('filterThumbsContainer');
  if (!el) return;
  if (!imgLoaded || !img.src) { el.innerHTML = '<div class="filter-empty">Load a photo to see filters</div>'; return; }
  const src = img.src;
  let html = '';
  FILTERS.forEach((f, i) => {
    const isSel = (currentFilter === f.code);
    const sel = isSel ? 'selected' : '';
    const filterStyle = f.code === 'none' ? 'none' : f.code;
    html += `<div class="filter-thumb ${sel}" onclick="applyFilterByIndex(${i}, this)">
      <div class="filter-thumb-img" style="background-image:url('${src}'); filter:${filterStyle};"></div>
      <span class="filter-thumb-label">${f.name}</span>
    </div>`;
  });
  el.innerHTML = html;
}

function applyFilterByIndex(i, el) {
  const f = FILTERS[i];
  if (!f) return;
  currentFilter = f.code;
  currentTemplate = 'none';
  el.parentElement.querySelectorAll('.filter-thumb').forEach(t => t.classList.remove('selected'));
  el.classList.add('selected');
  saveState(); redraw();
}

function renderProjectsList() {
  const g = document.getElementById('gallery');
  const keys = Object.keys(localStorage).filter(k => k.startsWith('music_proj_'));
  keys.sort().reverse();
  let html = '';
  html += `<div class="gal-add" onclick="document.getElementById('homeImageUpload').click()">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </div>`;
  keys.forEach(key => {
    try {
      const p = JSON.parse(localStorage.getItem(key));
      html += `<div class="gal-item" onclick="loadProject('${key}')">
        <img src="${p.image}" alt="">
        <button class="gal-del" onclick="event.stopPropagation();deleteProject('${key}')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>`;
    } catch(e) {}
  });
  if (keys.length === 0) html += `<div class="gal-empty">Tap + to add photos</div>`;
  g.innerHTML = html;
}
function deleteProject(key) {
  if (confirm("Delete this photo?")) { localStorage.removeItem(key); renderProjectsList(); }
}

function setupCanvasFromImage(newImg) {
  img = newImg;
  const MAX = 1080;
  let w = newImg.width, h = newImg.height;
  if (w > MAX || h > MAX) {
    const s = MAX / Math.max(w, h);
    w = Math.round(w * s); h = Math.round(h * s);
  }
  canvas.width = w;
  canvas.height = h;
}

function loadProject(key) {
  const p = JSON.parse(localStorage.getItem(key));
  currentProjectId = key.replace('music_', '');
  if (p.textLayers) { textLayers = p.textLayers; activeLayerId = textLayers.length ? textLayers[0].id : null; }
  else { textLayers = []; activeLayerId = null; }
  bInput.value = p.brightness ?? 100;
  cInput.value = p.contrast ?? 100;
  sInput.value = p.saturation ?? 100;
  nInput.value = p.noise ?? 0;
  subjAmt.value = p.subjectAmount ?? 12;
  currentFilter = p.filter ?? 'none';
  currentBorder = p.border ?? 'none';
  currentBorderColor = p.borderColor ?? '#ffffff';
  currentBorderSize = p.borderSize ?? 5;
  currentBgColor = p.bgColor ?? null;
  currentBgColorSize = p.bgColorSize ?? 8;
  document.getElementById('borderSizeInput').value = currentBorderSize;
  document.getElementById('borderSizeVal').innerText = currentBorderSize;
  document.getElementById('bgColorSizeInput').value = currentBgColorSize;
  document.getElementById('bgColorSizeVal').innerText = currentBgColorSize;
  currentTemplate = p.template ?? 'none';
  subjectMode = p.subjectMode ?? 'none';
  strokeColor = p.strokeColor ?? '#ffffff';
  personMask = null; subjectReady = false;
  crop = { x: 0, y: 0, w: 1, h: 1 };
  undoStack = []; redoStack = []; updateHistoryButtons();

  const sourceImage = p.originalImage || p.image;
  originalImageSrc = sourceImage;
  img.onload = function() {
    if (p.canvasW && p.canvasH) { canvas.width = p.canvasW; canvas.height = p.canvasH; }
    else setupCanvasFromImage(img);
    imgLoaded = true;
    buildFilterThumbs(); buildTemplates(); buildBorders(); buildBgColors();
    saveState(); redraw();
  };
  img.src = sourceImage;

  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-studio').classList.add('active');
  document.getElementById('cropOverlay').classList.remove('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-adjust').classList.add('active');
  document.querySelector('.nav-btn[data-panel="adjust"]').classList.add('active');
}

function initHomeUpload() {
  document.getElementById('homeImageUpload').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    e.target.value = '';
    let overlay = document.getElementById('importOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'importOverlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:14px;';
      overlay.innerHTML = '<div id="importCount" style="margin-bottom:12px;">Importing...</div><div style="width:180px;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;"><div id="importBar" style="height:100%;width:0;background:#fff;transition:width .2s;"></div></div>';
      document.body.appendChild(overlay);
    }
    overlay.style.display = 'flex';
    let done = 0;
    for (const file of files) {
      await importOnePhoto(file);
      done++;
      document.getElementById('importBar').style.width = Math.round((done / files.length) * 100) + '%';
      document.getElementById('importCount').textContent = 'Importing ' + done + ' / ' + files.length;
    }
    overlay.style.display = 'none';
    renderProjectsList();
  });
}

function importOnePhoto(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      const newImg = new Image();
      newImg.onload = function() {
        const MAX = 1080;
        let w = newImg.width, h = newImg.height;
        if (w > MAX || h > MAX) {
          const s = MAX / Math.max(w, h);
          w = Math.round(w * s); h = Math.round(h * s);
        }
        const tmp = document.createElement('canvas');
        tmp.width = w; tmp.height = h;
        tmp.getContext('2d').drawImage(newImg, 0, 0, w, h);
        const dataURL = tmp.toDataURL('image/jpeg', 0.88);
        const id = 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        try {
          localStorage.setItem('music_' + id, JSON.stringify({
            name: 'Photo', date: new Date().toLocaleDateString(),
            image: dataURL, originalImage: dataURL,
            canvasW: w, canvasH: h,
            textLayers: [],
            brightness: 100, contrast: 100, saturation: 100, noise: 0,
            filter: 'none',
            border: 'none', borderColor: '#ffffff',
            borderSize: 5, bgColor: null, bgColorSize: 8, template: 'none',
            subjectMode: 'none', strokeColor: '#ffffff', subjectAmount: 12
          }));
        } catch (err) { console.warn('Storage full', err); }
        resolve();
      };
      newImg.onerror = () => resolve();
      newImg.src = ev.target.result;
    };
    reader.onerror = () => resolve();
    reader.readAsDataURL(file);
  });
}

function goHome() {
  document.getElementById('view-studio').classList.remove('active');
  document.getElementById('view-home').classList.add('active');
  textMenu.style.display = 'none';
  document.getElementById('cropOverlay').classList.remove('active');
  renderProjectsList();
}

function resetEverything() {
  bInput.value = 100; cInput.value = 100; sInput.value = 100; nInput.value = 0;
  currentFilter = 'none';
  currentBorder = 'none'; currentBgColor = null;
  textLayers = []; activeLayerId = null;
  subjectMode = 'none'; personMask = null; subjectReady = false;
  document.querySelectorAll('.template-thumb, .filter-thumb, .border-thumb, .bgcolor-swatch').forEach(c => c.classList.remove('selected'));
  syncActiveInputs(); updateTextLayersUI();
  redraw(); saveState();
}

function saveState() {
  if (!imgLoaded) return;
  const state = canvas.toDataURL();
  if (!undoStack.length || undoStack[undoStack.length - 1] !== state) {
    undoStack.push(state);
    if (undoStack.length > 15) undoStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }
}
function undo() {
  if (undoStack.length > 1) {
    redoStack.push(undoStack.pop());
    const prev = undoStack[undoStack.length - 1];
    const t = new Image();
    t.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(t,0,0); updateHistoryButtons(); };
    t.src = prev;
  }
}
function redo() {
  if (redoStack.length) {
    const nxt = redoStack.pop();
    undoStack.push(nxt);
    const t = new Image();
    t.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(t,0,0); updateHistoryButtons(); };
    t.src = nxt;
  }
}
function updateHistoryButtons() {
  document.getElementById('undoBtn').disabled = undoStack.length <= 1;
  document.getElementById('redoBtn').disabled = redoStack.length === 0;
}

function getCanvasCoordinates(e, touch) {
  const rect = canvas.getBoundingClientRect();
  const cx = touch ? touch.clientX : (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = touch ? touch.clientY : (e.touches ? e.touches[0].clientY : e.clientY);
  return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
}
function touchDist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function touchAngle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }

canvas.addEventListener('mousedown', startTouch);
canvas.addEventListener('touchstart', startTouch, {passive: false});
canvas.addEventListener('mousemove', onTouchMove);
canvas.addEventListener('touchmove', onTouchMove, {passive: false});
canvas.addEventListener('mouseup', endTouch);
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);

function startTouch(e) {
  if (!imgLoaded || isCropPanelActive()) return;
  if (e.preventDefault) e.preventDefault();

  if (e.touches) {
    touches.clear();
    for (const t of e.touches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
  } else {
    touches.clear();
    touches.set('mouse', { x: e.clientX, y: e.clientY });
  }

  if (touches.size === 2) {
    const arr = Array.from(touches.values());
    const dist = touchDist(arr[0], arr[1]);
    const ang = touchAngle(arr[0], arr[1]);
    if (activeLayerId !== null) {
      const l = textLayers.find(x => x.id === activeLayerId);
      if (l) { gesture = { type: 'text', id: l.id, startDist: dist, startAngle: ang, startSize: l.size, startRot: l.rotation || 0 }; return; }
    }
    return;
  }

  if (touches.size !== 1) return;
  const pos = getCanvasCoordinates(e, e.touches ? e.touches[0] : null);

  let clickedLayer = null;
  for (const layer of textLayers) {
    ctx.font = `bold ${layer.size}px '${layer.font}', sans-serif`;
    const m = ctx.measureText(layer.text);
    const w = m.width, h = parseInt(layer.size);
    if (pos.x >= layer.x - w/2 - 20 && pos.x <= layer.x + w/2 + 20 && pos.y >= layer.y - h && pos.y <= layer.y + 15) {
      clickedLayer = layer; break;
    }
  }
  if (clickedLayer) {
    activeLayerId = clickedLayer.id;
    syncActiveInputs(); updateTextLayersUI();
    isDraggingText = true;
    showFloatingMenu(clickedLayer.x, clickedLayer.y);
  } else {
    textMenu.style.display = 'none';
    isDraggingFx = true;
    fxX = pos.x; fxY = pos.y;
    redraw();
  }
}

function onTouchMove(e) {
  if (!imgLoaded || isCropPanelActive()) return;
  if (e.preventDefault) e.preventDefault();

  if (e.touches) {
    for (const t of e.touches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
  } else if (touches.has('mouse')) {
    touches.set('mouse', { x: e.clientX, y: e.clientY });
  }

  if (touches.size === 2 && gesture) {
    const arr = Array.from(touches.values());
    const dist = touchDist(arr[0], arr[1]);
    const ang = touchAngle(arr[0], arr[1]);
    const scale = dist / gesture.startDist;
    const rotDelta = ang - gesture.startAngle;

    if (gesture.type === 'text') {
      const l = textLayers.find(x => x.id === gesture.id);
      if (l) {
        l.size = Math.max(8, Math.min(400, Math.round(gesture.startSize * scale)));
        l.rotation = gesture.startRot + rotDelta;
        document.getElementById('fSizeVal').innerText = l.size;
        sizeInput.value = l.size;
      }
    }
    redraw();
    return;
  }

  const pos = getCanvasCoordinates(e, e.touches ? e.touches[0] : null);

  if (isDraggingText) {
    const l = textLayers.find(x => x.id === activeLayerId);
    if (l) { l.x = pos.x; l.y = pos.y; showFloatingMenu(l.x, l.y); redraw(); }
  } else if (isDraggingFx) {
    fxX = pos.x; fxY = pos.y; redraw();
  }
}

function endTouch(e) {
  if (e && e.changedTouches) {
    for (const t of e.changedTouches) touches.delete(t.identifier);
  } else {
    touches.delete('mouse');
  }
  if (touches.size < 2) gesture = null;
  if (isDraggingText || isDraggingFx) {
    isDraggingText = false; isDraggingFx = false;
    saveState();
  }
}

function showFloatingMenu(x, y) {
  const rect = canvas.getBoundingClientRect();
  const sx = rect.width / canvas.width, sy = rect.height / canvas.height;
  textMenu.style.left = (x * sx) + 'px';
  textMenu.style.top = ((y * sy) - 30) + 'px';
  textMenu.style.display = 'block';
}
function moveActiveText(dx, dy) {
  const l = textLayers.find(x => x.id === activeLayerId);
  if (l) { l.x += dx; l.y += dy; showFloatingMenu(l.x, l.y); redraw(); saveState(); }
}
function centerActiveTextHoriz() {
  const l = textLayers.find(x => x.id === activeLayerId);
  if (l) { l.x = canvas.width / 2; showFloatingMenu(l.x, l.y); redraw(); saveState(); }
}
function addNewTextLayer() {

function deleteActiveTextLayer() {

  activeLayerId = textLayers.length ? textLayers[0].id : null;

function selectLayer(id) {

function updateTextLayersUI() {
  const el = document.getElementById('textLayersList');
  if (!el) return;
  if (textLayers.length === 0) { el.innerHTML = ''; return; }
  let html = '';
  textLayers.forEach(l => {
    const act = l.id === activeLayerId ? 'active' : '';
    html += `<div class="text-layer-item ${act}" onclick="selectLayer(${l.id})">
      <span style="font-weight:bold;font-size:11px;">${l.text || '(Empty)'}</span>
      <span style="font-size:10px;color:#666;">${l.font}</span>
    </div>`;
  });
  el.innerHTML = html;
}
function syncActiveInputs() {

  tInput.value = l.text;

function showCropOverlay(show) {
  const ov = document.getElementById('cropOverlay');
  if (show && imgLoaded) {
    ov.classList.add('active');
    crop = { x: 0, y: 0, w: 1, h: 1 };
    updateCropBox();
  } else {
    ov.classList.remove('active');
  }
}

function updateCropBox() {
  const box = document.getElementById('cropBox');
  const rect = canvas.getBoundingClientRect();
  const contRect = canvas.parentElement.getBoundingClientRect();
  const ox = rect.left - contRect.left;
  const oy = rect.top - contRect.top;
  box.style.left = (ox + rect.width * crop.x) + 'px';
  box.style.top = (oy + rect.height * crop.y) + 'px';
  box.style.width = (rect.width * crop.w) + 'px';
  box.style.height = (rect.height * crop.h) + 'px';
}

function initCropOverlay() {
  const box = document.getElementById('cropBox');

  box.addEventListener('pointerdown', (e) => {
    if (!isCropPanelActive()) return;
    e.preventDefault(); e.stopPropagation();
    const isCorner = e.target.classList.contains('crop-corner');
    const corner = isCorner ? e.target.dataset.corner : null;
    const rect = canvas.getBoundingClientRect();
    cropDrag = {
      type: corner || 'move',
      startX: e.clientX, startY: e.clientY,
      start: { ...crop },
      canvasRect: rect
    };
  });

  window.addEventListener('pointermove', (e) => {
    if (!cropDrag) return;
    e.preventDefault();
    const dx = (e.clientX - cropDrag.startX) / cropDrag.canvasRect.width;
    const dy = (e.clientY - cropDrag.startY) / cropDrag.canvasRect.height;
    const s = cropDrag.start;
    const MIN = 0.15;
    let { x, y, w, h } = s;

    if (cropDrag.type === 'move') {
      x = Math.max(0, Math.min(1 - s.w, s.x + dx));
      y = Math.max(0, Math.min(1 - s.h, s.y + dy));
    } else if (cropDrag.type === 'tl') {
      const nx = Math.max(0, Math.min(s.x + s.w - MIN, s.x + dx));
      const ny = Math.max(0, Math.min(s.y + s.h - MIN, s.y + dy));
      x = nx; y = ny; w = s.x + s.w - nx; h = s.y + s.h - ny;
    } else if (cropDrag.type === 'tr') {
      const ny = Math.max(0, Math.min(s.y + s.h - MIN, s.y + dy));
      y = ny; h = s.y + s.h - ny;
      w = Math.max(MIN, Math.min(1 - s.x, s.w + dx));
    } else if (cropDrag.type === 'bl') {
      const nx = Math.max(0, Math.min(s.x + s.w - MIN, s.x + dx));
      x = nx; w = s.x + s.w - nx;
      h = Math.max(MIN, Math.min(1 - s.y, s.h + dy));
    } else if (cropDrag.type === 'br') {
      w = Math.max(MIN, Math.min(1 - s.x, s.w + dx));
      h = Math.max(MIN, Math.min(1 - s.y, s.h + dy));
    }
    crop = { x, y, w, h };
    updateCropBox();
  });

  window.addEventListener('pointerup', () => { cropDrag = null; });
  window.addEventListener('pointercancel', () => { cropDrag = null; });
  window.addEventListener('resize', () => { if (isCropPanelActive()) updateCropBox(); });
}

function setCropRect(ratio) {
  if (ratio === 'free') { crop = { x: 0, y: 0, w: 1, h: 1 }; updateCropBox(); return; }
  let tr;
  if (ratio === '1:1') tr = 1;
  else if (ratio === '4:5') tr = 4/5;
  else if (ratio === '9:16') tr = 9/16;
  else if (ratio === '16:9') tr = 16/9;
  const ca = canvas.width / canvas.height;
  const cr = tr / ca;
  let w, h;
  if (cr >= 1) { w = 1; h = 1 / cr; } else { h = 1; w = cr; }
  crop = { x: (1 - w) / 2, y: (1 - h) / 2, w, h };
  updateCropBox();
}

function resetCrop() {
  crop = { x: 0, y: 0, w: 1, h: 1 };
  updateCropBox();
}

function applyCropNow() {
  if (!imgLoaded) return;
  if (crop.w >= 0.99 && crop.h >= 0.99 && crop.x < 0.01 && crop.y < 0.01) return;
  const px = Math.round(crop.x * canvas.width);
  const py = Math.round(crop.y * canvas.height);
  const pw = Math.round(crop.w * canvas.width);
  const ph = Math.round(crop.h * canvas.height);

  const full = document.createElement('canvas');
  full.width = canvas.width; full.height = canvas.height;
  full.getContext('2d').drawImage(img, 0, 0);

  const tmp = document.createElement('canvas');
  tmp.width = pw; tmp.height = ph;
  tmp.getContext('2d').drawImage(full, px, py, pw, ph, 0, 0, pw, ph);
  const url = tmp.toDataURL('image/png');

  const newImg = new Image();
  newImg.onload = function() {
    img = newImg;
    originalImageSrc = url;
    canvas.width = pw; canvas.height = ph;
    personMask = null; subjectReady = false;
    crop = { x: 0, y: 0, w: 1, h: 1 };
    buildFilterThumbs(); buildTemplates();
    redraw(); saveState();
    showCropOverlay(false);
    switchPanel('adjust', document.querySelector('.nav-btn[data-panel="adjust"]'));
  };
  newImg.src = url;
}

function rotateImage(deg) {
  if (!imgLoaded) return;
  const c = document.createElement('canvas');
  c.width = canvas.height; c.height = canvas.width;
  const cx = c.getContext('2d');
  cx.translate(c.width/2, c.height/2);
  cx.rotate(deg * Math.PI / 180);
  cx.drawImage(img, -canvas.width/2, -canvas.height/2);
  const url = c.toDataURL('image/png');
  const newImg = new Image();
  newImg.onload = function() {
    img = newImg;
    originalImageSrc = url;
    canvas.width = c.width; canvas.height = c.height;
    redraw(); saveState();
    buildFilterThumbs(); buildTemplates();
    if (isCropPanelActive()) { crop = { x: 0, y: 0, w: 1, h: 1 }; updateCropBox(); }
  };
  newImg.src = url;
}
function flipImage(dir) {
  if (!imgLoaded) return;
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const cx = c.getContext('2d');
  cx.translate(dir === 'h' ? canvas.width : 0, dir === 'v' ? canvas.height : 0);
  cx.scale(dir === 'h' ? -1 : 1, dir === 'v' ? -1 : 1);
  cx.drawImage(img, 0, 0);
  const url = c.toDataURL('image/png');
  const newImg = new Image();
  newImg.onload = function() {
    img = newImg;
    originalImageSrc = url;
    redraw(); saveState();
    buildFilterThumbs(); buildTemplates();
  };
  newImg.src = url;
}

window.detectSubject = async function() {
  const status = document.getElementById('subjectStatus');
  const btn = document.getElementById('detectBtn');
  if (!imgLoaded) { status.textContent = 'Upload an image first.'; return; }
  if (typeof SelfieSegmentation === 'undefined') { status.textContent = 'Model failed to load.'; return; }
  btn.disabled = true;
  status.textContent = 'Loading model...';
  try {
    if (!selfieSeg) {
      selfieSeg = new SelfieSegmentation({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/${f}` });
      selfieSeg.setOptions({ modelSelection: 1 });
    }
    status.textContent = 'Analysing photo...';
    const result = await new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error('Timed out.')), 30000);
      selfieSeg.onResults((r) => { clearTimeout(t); resolve(r); });
      selfieSeg.send({ image: img });
    });
    const raw = document.createElement('canvas');
    raw.width = canvas.width; raw.height = canvas.height;
    const rctx = raw.getContext('2d');
    rctx.drawImage(result.segmentationMask, 0, 0, canvas.width, canvas.height);
    const id = rctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) d[i + 3] = d[i];
    rctx.putImageData(id, 0, 0);
    const soft = document.createElement('canvas');
    soft.width = canvas.width; soft.height = canvas.height;
    const sctx = soft.getContext('2d');
    sctx.filter = 'blur(3px)';
    sctx.drawImage(raw, 0, 0);
    personMask = soft;
    subjectReady = true;
    status.textContent = 'Subject detected. Pick Blur or Stroke below.';
    btn.textContent = 'RE-DETECT';
    btn.disabled = false;
    redraw(); saveState();
  } catch (err) {
    status.textContent = 'Failed: ' + err.message;
    btn.disabled = false;
  }
};

}

let aiGenShape = 'square';
function setGenShape(shape, el) {
  aiGenShape = shape;
  el.parentElement.querySelectorAll('.h-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}
const GEN_SHAPES = {
  square:   { w: 768,  h: 768  },
  portrait: { w: 768,  h: 960  },
  story:    { w: 720,  h: 1280 },
  wide:     { w: 1280, h: 720  },
  cover:    { w: 1024, h: 1024 }
};

async function generateAIImage() {
  const prompt = document.getElementById('aiGenPrompt').value.trim();
  const status = document.getElementById('aiGenStatus');
  const btn = document.getElementById('aiGenBtn');
  if (!prompt) { status.textContent = 'Please describe the image.'; return; }
  btn.disabled = true;
  const dims = GEN_SHAPES[aiGenShape] || GEN_SHAPES.square;
  const seed = Math.floor(Math.random() * 1000000);
  const models = ['flux-realism', 'flux', 'flux-pro'];
  let blob = null;
  for (const model of models) {
    status.innerHTML = '<span class="spinner"></span>Generating...';
    try {
      const params = new URLSearchParams({
        width: String(dims.w), height: String(dims.h), seed: String(seed),
        model, nologo: 'true', referrer: 'mxstudio', enhance: 'true'
      });
      const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?' + params.toString();
      const r = await fetch(url, { mode: 'cors' });
      if (!r.ok) continue;
      const b = await r.blob();
      if (b.size < 1000) continue;
      blob = b; break;
    } catch (e) {}
  }
  if (!blob) { status.textContent = 'All models busy. Try again in 30s.'; btn.disabled = false; return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    const newImg = new Image();
    newImg.onload = function() {
      img = newImg;
      originalImageSrc = e.target.result;
      setupCanvasFromImage(newImg);
      imgLoaded = true;
      currentProjectId = 'proj_' + Date.now();
      personMask = null; subjectReady = false;
      crop = { x: 0, y: 0, w: 1, h: 1 };
      textLayers = []; activeLayerId = null;
      currentBorder = 'none'; currentBorderColor = '#ffffff'; currentTemplate = 'none'; currentBgColor = null;
      closeAIPanel();
      document.getElementById('view-home').classList.remove('active');
      document.getElementById('view-studio').classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-adjust').classList.add('active');
      document.querySelector('.nav-btn[data-panel="adjust"]').classList.add('active');
      syncActiveInputs(); updateTextLayersUI();
      buildFilterThumbs(); buildTemplates(); buildBorders(); buildBgColors();
      redraw(); saveState();
      status.textContent = ''; btn.disabled = false;
    };
    newImg.onerror = function() { status.textContent = 'Failed.'; btn.disabled = false; };
    newImg.src = e.target.result;
  };
  reader.readAsDataURL(blob);
}

function drawBorder() {
  if (!imgLoaded || currentBorder === 'none') return;
  const w = canvas.width, h = canvas.height;
  const base = Math.min(w, h);
  const col = currentBorderColor;
  const pct = currentBorderSize / 100;

  if (currentBorder === 'white') {
    const t = Math.round(base * pct);
    ctx.fillStyle = col;
    ctx.fillRect(0, 0, w, t); ctx.fillRect(0, h - t, w, t);
    ctx.fillRect(0, 0, t, h); ctx.fillRect(w - t, 0, t, h);
  } else if (currentBorder === 'black') {
    const t = Math.round(base * pct * 1.6);
    ctx.fillStyle = col;
    ctx.fillRect(0, 0, w, t); ctx.fillRect(0, h - t, w, t);
    ctx.fillRect(0, 0, t, h); ctx.fillRect(w - t, 0, t, h);
  } else if (currentBorder === 'rounded') {
    const t = Math.round(base * pct);
    const r = Math.round(base * pct * 1.6);
    ctx.save();
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.rect(0, 0, w, h);
    ctx.moveTo(t + r, t); ctx.lineTo(w - t - r, t);
    ctx.quadraticCurveTo(w - t, t, w - t, t + r);
    ctx.lineTo(w - t, h - t - r);
    ctx.quadraticCurveTo(w - t, h - t, w - t - r, h - t);
    ctx.lineTo(t + r, h - t);
    ctx.quadraticCurveTo(t, h - t, t, h - t - r);
    ctx.lineTo(t, t + r);
    ctx.quadraticCurveTo(t, t, t + r, t);
    ctx.closePath();
    ctx.fill('evenodd');
    ctx.restore();
  } else if (currentBorder === 'polaroid') {
    const side = Math.round(base * pct);
    const bottom = Math.round(base * pct * 3.4);
    ctx.fillStyle = col;
    ctx.fillRect(0, 0, w, side); ctx.fillRect(0, 0, side, h);
    ctx.fillRect(w - side, 0, side, h); ctx.fillRect(0, h - bottom, w, bottom);
  } else if (currentBorder === 'shadow') {
    const grad = ctx.createRadialGradient(w/2, h/2, base*0.25, w/2, h/2, Math.max(w, h)*0.75);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${0.4 + pct * 3})`);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
  }
}

function redraw() {
  if (!imgLoaded) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let filterString = `brightness(${bInput.value}%) contrast(${cInput.value}%) saturate(${sInput.value}%) `;
  if (currentFilter !== 'none') filterString += currentFilter;
  const OVER = 6;

  const photoLayer = document.createElement('canvas');
  photoLayer.width = canvas.width;
  photoLayer.height = canvas.height;
  const plctx = photoLayer.getContext('2d');

  if (subjectReady && personMask && subjectMode !== 'none') {
    const amt = parseInt(subjAmt.value);
    const blurred = document.createElement('canvas');
    blurred.width = canvas.width; blurred.height = canvas.height;
    const bctx = blurred.getContext('2d');
    bctx.filter = filterString + ` blur(${amt}px)`;
    bctx.drawImage(img, -OVER, -OVER, canvas.width + OVER*2, canvas.height + OVER*2);
    const person = document.createElement('canvas');
    person.width = canvas.width; person.height = canvas.height;
    const pctx = person.getContext('2d');
    pctx.filter = filterString;
    pctx.drawImage(img, -OVER, -OVER, canvas.width + OVER*2, canvas.height + OVER*2);
    pctx.globalCompositeOperation = 'destination-in';
    pctx.drawImage(personMask, 0, 0);
    if (subjectMode === 'blur') {
      plctx.drawImage(blurred, 0, 0);
      plctx.drawImage(person, 0, 0);
    } else if (subjectMode === 'stroke') {
      const sharp = document.createElement('canvas');
      sharp.width = canvas.width; sharp.height = canvas.height;
      const sctx = sharp.getContext('2d');
      sctx.filter = filterString;
      sctx.drawImage(img, -OVER, -OVER, canvas.width + OVER*2, canvas.height + OVER*2);
      plctx.drawImage(sharp, 0, 0);
      const ring = document.createElement('canvas');
      ring.width = canvas.width; ring.height = canvas.height;
      const rctx = ring.getContext('2d');
      const offset = Math.max(3, amt);
      for (let a = 0; a < 360; a += 10) {
        const rad = a * Math.PI / 180;
        rctx.drawImage(personMask, Math.cos(rad) * offset, Math.sin(rad) * offset);
      }
      rctx.globalCompositeOperation = 'destination-out';
      rctx.drawImage(personMask, 0, 0);
      rctx.globalCompositeOperation = 'source-in';
      rctx.fillStyle = strokeColor;
      rctx.fillRect(0, 0, canvas.width, canvas.height);
      plctx.drawImage(ring, 0, 0);
      plctx.drawImage(person, 0, 0);
    }
  } else {
    plctx.filter = filterString;
    plctx.drawImage(img, -OVER, -OVER, canvas.width + OVER*2, canvas.height + OVER*2);
    plctx.filter = 'none';
  }

  if (currentBgColor) {
    ctx.fillStyle = currentBgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const pad = Math.round(Math.min(canvas.width, canvas.height) * (currentBgColorSize / 100));
    ctx.drawImage(photoLayer, 0, 0, canvas.width, canvas.height, pad, pad, canvas.width - pad * 2, canvas.height - pad * 2);
  } else {
    ctx.drawImage(photoLayer, 0, 0);
  }

  const fade = parseInt(nInput.value);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${(fade / 100) * 0.4})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }

  if (!currentBgColor) drawBorder();

  textLayers.forEach(layer => {
    if (layer.text && layer.text.trim() !== '') {
      ctx.save();
      ctx.translate(layer.x, layer.y);
      if (layer.rotation) ctx.rotate(layer.rotation);
      ctx.font = `bold ${layer.size}px '${layer.font}', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (activeLayerId === layer.id) {
        const m = ctx.measureText(layer.text);
        ctx.strokeStyle = 'rgba(255,255,255,.6)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(-m.width/2 - 8, -layer.size/2 - 4, m.width + 16, layer.size + 8);
        ctx.setLineDash([]);
      }
      if (layer.style === 'stroke') {
        ctx.lineWidth = Math.max(2, layer.size * 0.08);
        ctx.strokeStyle = '#000';
        ctx.strokeText(layer.text, 0, 0);
      } else if (layer.style === 'shadow') {
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 12; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
      } else if (layer.style === 'glow') {
        ctx.shadowColor = layer.color;
        ctx.shadowBlur = 20;
      }
      ctx.fillStyle = layer.color;
      ctx.fillText(layer.text, 0, 0);
      ctx.restore();
    }
  });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW failed', e));
  });
}
</script>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
