<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mx Studio</title>
<link rel="manifest" href="./manifest2.json">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Audiowide&family=Alfa+Slab+One&family=Bebas+Neue&family=Black+Ops+One&family=Bungee&family=Bungee+Inline&family=Chango&family=Chewy&family=Cinzel:wght@700&family=Coiny&family=Creepster&family=Damion&family=Dancing+Script:wght@700&family=Diplomata+SC&family=Frijole&family=Gloria+Hallelujah&family=Great+Vibes&family=Gugi&family=Knewave&family=Lobster&family=Luckiest+Guy&family=Merriweather:wght@700&family=Monoton&family=Montserrat:wght@800&family=Orbitron:wght@900&family=Oswald:wght@700&family=Pacifico&family=Parisienne&family=Permanent+Marker&family=Playfair+Display:wght@700&family=Poppins:wght@700&family=Press+Start+2P&family=Righteous&family=Russo+One&family=Rye&family=Satisfy&family=Special+Elite&family=Yellowtail&display=swap" rel="stylesheet">
<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body { height:100vh; width:100%; overflow:hidden; overscroll-behavior:none; position:fixed; top:0; left:0; margin:0; padding:0; background:#0a0a0a; color:#fff; font-family:-apple-system,'Segoe UI',sans-serif; text-align:center; touch-action:manipulation; }
.view { display:none; }
.view.active { display:flex; flex-direction:column; height:100vh; padding:8px 8px 92px 8px; overflow:hidden; }

.home-container { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:20px 14px 30px 14px; max-width:520px; margin:0 auto; width:100%; }
.home-top-bar { padding:0 0 20px 0; }
.home-new-btn { width:100%; background:linear-gradient(135deg, #FFA55C 0%, #FF6B6B 50%, #FF4B7B 100%); color:#fff; border:none; padding:28px 20px; border-radius:16px; font-size:16px; font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; box-shadow:0 8px 24px rgba(255,107,107,.35); transition:transform .1s ease; }
.home-new-btn:active { transform:scale(.98); }
.home-new-btn .plus-icon { width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; }
.home-new-btn svg { stroke:#fff; }

.section-title { font-size:20px; font-weight:800; color:#fff; padding:4px 0 14px 0; text-align:left; }

.projects-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 0 20px 0; }
.project-card { cursor:pointer; position:relative; }
.project-card:active { opacity:.9; }
.project-card-img { width:100%; aspect-ratio:1/1; background:#111; border-radius:6px; overflow:hidden; }
.project-card-img img { width:100%; height:100%; object-fit:cover; display:block; }
.project-card-info { padding:6px 0 0 0; text-align:left; }
.project-card-name { font-size:11px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:1px; }
.project-card-date { font-size:9px; color:#666; }
.project-card-del { position:absolute; top:4px; right:4px; width:22px; height:22px; background:rgba(0,0,0,.7); border:none; border-radius:50%; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.project-card-del svg { stroke:#fff; }

.home-empty { padding:60px 20px; text-align:center; }
.home-empty-icon { font-size:56px; margin-bottom:18px; opacity:.55; }
.home-empty-title { font-size:22px; letter-spacing:2px; color:#fff; margin-bottom:8px; font-weight:900; }
.home-empty-sub { font-size:13px; color:#666; line-height:1.6; margin-bottom:26px; }

.canvas-container { position:relative; display:inline-block; max-width:100%; margin:0 auto 4px auto; flex-shrink:0; }
canvas { max-width:100%; max-height:52vh; height:auto; width:auto; background:#000; cursor:move; touch-action:none; display:block; }
#cropOverlay { position:absolute; inset:0; display:none; z-index:40; pointer-events:none; }
#cropOverlay.active { display:block; pointer-events:auto; }
#cropBox { position:absolute; border:2px solid #fff; box-shadow:0 0 0 9999px rgba(0,0,0,0.7); cursor:move; touch-action:none; pointer-events:auto; }
.crop-corner { position:absolute; width:32px; height:32px; background:#fff; border-radius:50%; box-shadow:0 0 10px rgba(0,0,0,.7); touch-action:none; pointer-events:auto; }
.crop-corner[data-corner="tl"] { top:-16px; left:-16px; }
.crop-corner[data-corner="tr"] { top:-16px; right:-16px; }
.crop-corner[data-corner="bl"] { bottom:-16px; left:-16px; }
.crop-corner[data-corner="br"] { bottom:-16px; right:-16px; }

#textFloatingMenu { display:none; position:absolute; background:rgba(15,15,15,.96); padding:8px; border-radius:10px; z-index:50; transform:translate(-50%,-125%); width:150px; }
.arrow-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:6px; }
.arrow-btn { background:#1a1a1a; color:#fff; border:none; padding:6px 0; border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.arrow-btn svg { stroke:#fff; }
.menu-actions { display:flex; justify-content:space-between; gap:4px; }
.menu-action-btn { background:#222; color:#fff; border:none; padding:5px 6px; border-radius:4px; font-size:10px; font-weight:bold; cursor:pointer; flex:1; }
.menu-action-btn.delete { background:#ff2c2c; }
.menu-action-btn.center-btn { background:#333; }

.top-bar { display:flex; justify-content:space-between; align-items:center; padding:6px 4px; margin-bottom:4px; gap:6px; flex-shrink:0; }
.top-tools { display:flex; gap:4px; align-items:center; }
.icon-btn { background:none; border:none; color:#fff; cursor:pointer; padding:8px; display:inline-flex; }
.icon-btn svg { stroke:currentColor; width:24px; height:24px; }
.icon-btn:disabled { color:#333; cursor:not-allowed; }
.icon-action { background:none; border:none; color:#fff; cursor:pointer; padding:6px; display:inline-flex; }
.icon-action svg { stroke:#fff; }

.bottom-nav { display:flex; justify-content:flex-start; align-items:stretch; background:#050505; border-top:1px solid #1a1a1a; padding:8px 0 10px; position:fixed; bottom:0; left:0; width:100%; z-index:100; overflow-x:auto; }
.bottom-nav::-webkit-scrollbar { display:none; }
.nav-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; flex:1 0 74px; background:none; border:none; color:#ffffff; font-size:9px; font-weight:800; cursor:pointer; padding:6px 4px; text-transform:uppercase; letter-spacing:.3px; opacity:.75; transition:opacity .15s ease, transform .15s ease; }
.nav-btn svg { stroke:#ffffff; width:24px; height:24px; }
.nav-btn.active { color:#ffffff; opacity:1; transform:translateY(-2px); }
.nav-btn.active svg { stroke:#ffffff; }

.panel { display:none; background:transparent; padding:10px 4px; text-align:left; font-size:12px; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; }
.panel.active { display:block; }
.sub-tabs { display:flex; justify-content:flex-start; gap:14px; margin-bottom:14px; border-bottom:1px solid #1a1a1a; padding-bottom:10px; overflow-x:auto; }
.sub-tabs::-webkit-scrollbar { display:none; }
.sub-tab { background:none; border:none; color:#666; font-weight:bold; font-size:11px; cursor:pointer; padding:2px 0; white-space:nowrap; flex-shrink:0; }
.sub-tab.active { color:#fff; border-bottom:2px solid #fff; }
.sub-view { display:none; }
.sub-view.active { display:block; }

input[type="range"] { -webkit-appearance:none; appearance:none; width:100%; max-width:240px; height:4px; background:#242424; border-radius:2px; outline:none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; background:#fff; border-radius:50%; cursor:pointer; }
input[type="range"]::-moz-range-thumb { width:20px; height:20px; background:#fff; border-radius:50%; cursor:pointer; border:none; }
.adjust-sliders { display:flex; flex-direction:column; gap:20px; padding:8px 4px; }

.h-scroll, .filter-thumbs, .template-thumbs, .border-thumbs, .color-row, .bgcolor-row, .sticker-grid, .bg-grid { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; }
.h-scroll::-webkit-scrollbar, .filter-thumbs::-webkit-scrollbar, .template-thumbs::-webkit-scrollbar, .border-thumbs::-webkit-scrollbar, .color-row::-webkit-scrollbar, .bgcolor-row::-webkit-scrollbar, .sticker-grid::-webkit-scrollbar, .bg-grid::-webkit-scrollbar { display:none; }
.sticker-grid { flex-wrap:wrap; }
.bg-grid { flex-wrap:wrap; }
.h-card { flex:0 0 auto; padding:8px 16px; background:#161616; border:none; border-radius:18px; font-size:11px; font-weight:600; color:#aaa; cursor:pointer; white-space:nowrap; }
.h-card.selected { color:#fff; background:#333; }

.template-thumb { flex:0 0 auto; width:64px; cursor:pointer; text-align:center; }
.template-thumb-img { width:64px; height:78px; border-radius:8px; background-size:cover; background-position:center; background-color:#111; }
.template-thumb.selected .template-thumb-img { box-shadow:0 0 0 2px #fff; }
.template-thumb-label { font-size:9px; color:#888; margin-top:4px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
.template-thumb.selected .template-thumb-label { color:#fff; }

.filter-thumb { flex:0 0 auto; width:62px; cursor:pointer; text-align:center; }
.filter-thumb-img { width:62px; height:62px; border-radius:8px; background-size:cover; background-position:center; background-color:#111; }
.filter-thumb.selected .filter-thumb-img { box-shadow:0 0 0 2px #fff; }
.filter-thumb-label { font-size:9px; color:#888; margin-top:4px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.filter-thumb.selected .filter-thumb-label { color:#fff; }
.filter-empty { color:#444; font-size:11px; padding:16px 8px; }

.border-thumb { flex:0 0 auto; width:56px; cursor:pointer; text-align:center; }
.border-thumb-img { width:56px; height:56px; border-radius:8px; background:#111; position:relative; overflow:hidden; }
.border-thumb.selected .border-thumb-img { box-shadow:0 0 0 2px #fff; }
.border-thumb-label { font-size:9px; color:#888; margin-top:4px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.border-thumb.selected .border-thumb-label { color:#fff; }
.bt-inner { position:absolute; inset:0; background:#333; }

.sticker-item { flex:0 0 auto; width:84px; height:84px; border-radius:10px; background:#111; overflow:hidden; cursor:pointer; display:flex; align-items:center; justify-content:center; border:2px solid transparent; }
.sticker-item.selected { border-color:#fff; }
.sticker-item img { max-width:90%; max-height:90%; object-fit:contain; }

.bg-item { flex:0 0 auto; width:72px; cursor:pointer; text-align:center; }
.bg-item-img { width:72px; height:72px; border-radius:10px; background:#111; overflow:hidden; border:2px solid transparent; }
.bg-item.selected .bg-item-img { border-color:#fff; }
.bg-item img { width:100%; height:100%; object-fit:cover; display:block; }
.bg-item-label { font-size:9px; color:#888; margin-top:4px; display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bg-item.selected .bg-item-label { color:#fff; }

.bcolor-circle { width:36px; height:36px; border-radius:50%; cursor:pointer; flex-shrink:0; border:2px solid #333; }
.bcolor-circle.selected { box-shadow:0 0 0 2px #fff; }
.color-circle { width:36px; height:36px; border-radius:50%; cursor:pointer; flex-shrink:0; border:2px solid #333; }
.color-circle.selected { box-shadow:0 0 0 2px #fff; }

.font-grid { display:flex; flex-wrap:wrap; gap:8px; max-height:200px; overflow-y:auto; padding:4px 0; }
.font-pill { background:#161616; border:none; color:#fff; padding:8px 12px; border-radius:16px; cursor:pointer; font-size:11px; font-weight:bold; white-space:nowrap; }

.text-layers-list { max-height:120px; overflow-y:auto; margin-bottom:10px; }
.text-layer-item { display:flex; justify-content:space-between; align-items:center; background:#141414; padding:8px 10px; border-radius:6px; margin-bottom:5px; }
.text-layer-item.active { background:#333; }

.add-text-btn { background:#fff; color:#000; border:none; padding:15px; width:100%; border-radius:10px; font-weight:bold; cursor:pointer; font-size:15px; margin-top:10px; letter-spacing:1px; }
input[type="text"] { color:#fff; font-size:13px; width:100%; box-sizing:border-box; padding:11px; background:#141414; border:none; border-radius:8px; margin-top:4px; }
.section-label { font-size:10px; color:#666; margin:14px 0 4px; display:block; letter-spacing:.6px; font-weight:700; }

.crop-toolbar { display:flex; gap:8px; padding:10px 4px; justify-content:center; flex-wrap:wrap; }
.crop-tool { background:#161616; color:#ccc; border:none; padding:10px 16px; border-radius:22px; font-size:11px; font-weight:bold; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
.crop-tool.active { background:#fff; color:#000; }
.crop-tool svg { stroke:currentColor; width:14px; height:14px; }

.bgcolor-row { display:flex; flex-wrap:wrap; gap:12px; padding:8px 4px; overflow:visible !important; }
.bgcolor-swatch { width:68px; height:68px; border-radius:14px; cursor:pointer; position:relative; border:2px solid #333; }
.bgcolor-swatch.selected { border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.4); }

.compact-sliders { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
.slider-row { display:flex; align-items:center; gap:12px; height:34px; }
.slider-label { font-size:10px; color:#888; font-weight:700; width:44px; text-align:left; text-transform:uppercase; letter-spacing:.6px; flex-shrink:0; }
.slider-row input[type="range"] { flex:1; }
.slider-val { font-size:11px; color:#fff; width:44px; text-align:right; font-weight:700; flex-shrink:0; }

.align-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:12px 0 8px 0; max-width:200px; margin:0 auto; }
.align-cell { aspect-ratio:1/1; background:#161616; border:1px solid #242424; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.align-cell svg { stroke:#888; width:16px; height:16px; }

.color-slider-wrap { display:flex; flex-direction:column; gap:14px; padding:8px 4px; }
.color-slider-row { display:flex; align-items:center; gap:12px; }
.color-slider-preview { width:38px; height:38px; border-radius:10px; border:2px solid #333; flex-shrink:0; }

.bgremover-menu { padding:8px 0; }
.bgremover-btn { width:100%; background:#161616; border:1px solid #242424; color:#fff; padding:24px 18px; border-radius:14px; font-size:14px; font-weight:700; cursor:pointer; text-align:center; margin-bottom:12px; display:flex; justify-content:center; align-items:center; }
.bgremover-btn .label { display:flex; flex-direction:column; gap:3px; align-items:center; }
.bgremover-btn .title { font-size:18px; font-weight:800; color:#fff; letter-spacing:1px; }
.bgremover-btn.best .title { color:#ff2c2c; }
.bgremover-btn:active { background:#1f1f1f; }

#splashScreen { position:fixed; inset:0; background:#0a0a0a; z-index:99999; display:flex; align-items:center; justify-content:center; opacity:1; transition:opacity .4s ease; }
#splashScreen.fade-out { opacity:0; pointer-events:none; }
.splash-inner { display:flex; flex-direction:column; align-items:center; gap:20px; padding:20px; width:100%; }

.gallery { display:block; }
.gal-item { position:relative; aspect-ratio:1/1; border-radius:6px; overflow:hidden; background:#141414; cursor:pointer; }
.gal-item img { width:100%; height:100%; object-fit:cover; display:block; }
.gal-del { position:absolute; top:4px; right:4px; width:22px; height:22px; background:rgba(255,44,44,.92); border:none; border-radius:50%; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.gal-del svg { stroke:#fff; }
.gal-add { display:flex; align-items:center; justify-content:center; background:transparent; border:1px dashed #2a2a2a; border-radius:6px; aspect-ratio:1/1; color:#444; cursor:pointer; }
.gal-empty { text-align:center; color:#444; font-size:11px; padding:20px 0; }
</style>
</head>
<body>

<div id="splashScreen">
  <div class="splash-inner">
    <svg width="90" height="90" viewBox="0 0 90 90" style="transform:rotate(-90deg);">
      <circle cx="45" cy="45" r="38" fill="none" stroke="#1a1a1a" stroke-width="5"/>
      <circle id="splashRing" cx="45" cy="45" r="38" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
    </svg>
  </div>
</div>

<div id="view-home" class="view active">
  <div class="home-container">
    <div id="gallery" class="gallery"></div>
  </div>
  <input type="file" id="homeImageUpload" accept="image/*" multiple style="display:none;">
</div>

<div id="view-studio" class="view">
  <div class="top-bar">
    <div class="top-tools">
      <button class="icon-btn" id="undoBtn" onclick="undo()" disabled><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6.36 2.64L3 13"/></svg></button>
      <button class="icon-btn" id="redoBtn" onclick="redo()" disabled><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016.36 2.64L21 13"/></svg></button>
    </div>
    <div style="display:flex;gap:4px;align-items:center;">
      <button class="icon-action" onclick="resetEverything()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M3 8a9 9 0 1017 5"/></svg></button>
      <button class="icon-action" onclick="saveProjectToHome()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
      <button class="icon-action" onclick="saveImage()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div id="cropOverlay"><div id="cropBox">
      <div class="crop-corner" data-corner="tl"></div>
      <div class="crop-corner" data-corner="tr"></div>
      <div class="crop-corner" data-corner="bl"></div>
      <div class="crop-corner" data-corner="br"></div>
    </div></div>
    <div id="textFloatingMenu">
      <div class="arrow-grid">
        <div></div>
        <button class="arrow-btn" onclick="moveActiveText(0,-5)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        <div></div>
        <button class="arrow-btn" onclick="moveActiveText(-5,0)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <button class="arrow-btn" onclick="centerActiveTextHoriz()"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg></button>
        <button class="arrow-btn" onclick="moveActiveText(5,0)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
        <div></div>
        <button class="arrow-btn" onclick="moveActiveText(0,5)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>
        <div></div>
      </div>
      <div class="menu-actions">
        <button class="menu-action-btn center-btn" onclick="centerActiveTextHoriz()">Center</button>
        <button class="menu-action-btn delete" onclick="deleteActiveTextLayer()">Delete</button>
      </div>
    </div>
  </div>

  <div id="panel-adjust" class="panel active">
    <label class="section-label" style="margin-top:0;">TEMPLATES</label>
    <div class="template-thumbs" id="templateContainer"></div>
    <label class="section-label">FINE TUNE</label>
    <div class="adjust-sliders">
      <input type="range" id="brightness" min="0" max="200" value="100">
      <input type="range" id="contrast" min="50" max="200" value="100">
      <input type="range" id="saturation" min="0" max="200" value="100">
      <input type="range" id="noise" min="0" max="100" value="0">
    </div>
  </div>

  <div id="panel-crop" class="panel">
    <label class="section-label" style="margin-top:0;">DRAG CORNERS TO CROP · TAP APPLY</label>
    <div class="crop-toolbar">
      <button class="crop-tool" onclick="setCropRect('free')">FREE</button>
      <button class="crop-tool" onclick="setCropRect('1:1')">1:1</button>
      <button class="crop-tool" onclick="setCropRect('4:5')">4:5</button>
      <button class="crop-tool" onclick="setCropRect('9:16')">9:16</button>
      <button class="crop-tool" onclick="setCropRect('16:9')">16:9</button>
    </div>
    <div class="crop-toolbar">
      <button class="crop-tool" onclick="rotateImage(90)">↻ Rotate</button>
      <button class="crop-tool" onclick="flipImage('h')">⇋ Flip H</button>
      <button class="crop-tool" onclick="flipImage('v')">⇅ Flip V</button>
    </div>
    <div class="crop-toolbar">
      <button class="crop-tool" onclick="resetCrop()">RESET</button>
      <button class="crop-tool" onclick="applyCropNow()" style="background:#ff2c2c;color:#fff;flex:1;justify-content:center;">✂ APPLY CROP</button>
    </div>

const EFFECTS_BASE = './effects/';

function loadImage(url) {
  return new Promise(res => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = url;
  });
}

async function probeOne(base) {
  let im = await loadImage(EFFECTS_BASE + base + '.jpg');
  if (im) return { fname: base + '.jpg', im };
  im = await loadImage(EFFECTS_BASE + base + '.jpeg');
  if (im) return { fname: base + '.jpeg', im };
  im = await loadImage(EFFECTS_BASE + base + '.png');
  if (im) return { fname: base + '.png', im };
  return null;
}

async function probeAdvisory() {
  const cfg = ADVISORY_CONFIG;
  const promises = [];
  for (let i = 1; i <= cfg.max; i++) {
    promises.push((async () => {
      let r = await probeOne('Advisory' + i);
      if (r) return r;
      r = await probeOne('advisory' + i);
      return r;
    })());
  }
  const results = await Promise.all(promises);
  cfg.files = results.filter(r => r !== null);
  cfg.files.forEach(r => { advisoryImages[r.fname] = r.im; });
}

async function probeBackgrounds() {
  const cfg = BG_CONFIG;
  const promises = [];
  for (let i = 1; i <= cfg.max; i++) promises.push(probeOne('background' + i));
  const results = await Promise.all(promises);
  cfg.files = results.filter(r => r !== null);
  cfg.files.forEach(r => { bgImages[r.fname] = r.im; });
}

async function preloadEffects() {
  await Promise.all([ probeAdvisory(), probeBackgrounds() ]);
  buildAdvisoryGrid();
  buildBgImageGrid();
}

function playCount(callback) {
  if (counterLocked) return;
  counterLocked = true;
  const el = document.getElementById('splashScreen');
  const ring = document.getElementById('splashRing');
  if (!el) { counterLocked = false; if (callback) callback(); return; }
  el.classList.remove('fade-out');
  el.style.display = 'flex';
  const DURATION = 4000;
  const CIRC = 238.76;
  const start = performance.now();
  let cb = false;
  if (ring) ring.setAttribute('stroke-dashoffset', CIRC);
  function step(now) {
    const elapsed = now - start;
    const pct = Math.min(1, elapsed / DURATION);
    if (ring) ring.setAttribute('stroke-dashoffset', CIRC * (1 - pct));
    if (!cb && pct >= 0.4 && callback) { cb = true; try { callback(); } catch(e){} }
    if (pct < 1) requestAnimationFrame(step);
    else {
      if (!cb && callback) { try { callback(); } catch(e){} }
      setTimeout(() => {
        el.classList.add('fade-out');
        setTimeout(() => { el.style.display = 'none'; counterLocked = false; }, 400);
      }, 150);
    }
  }
  requestAnimationFrame(step);
}

/* ============================================================
   SWIPE GESTURES — slide between panels
   ============================================================ */

let swipeStartX = 0, swipeStartY = 0, swipeStartTime = 0, swipeActive = false;

function initSwipeGestures() {
  const view = document.getElementById('view-studio');
  if (!view) return;
  view.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { swipeActive = false; return; }
    const t = e.touches[0];
    const target = e.target;
    if (target.closest('.canvas-container') || target.closest('.bottom-nav') || target.closest('input') || target.closest('.crop-tool') || target.closest('.tool-pill')) {
      swipeActive = false; return;
    }
    swipeStartX = t.clientX; swipeStartY = t.clientY;
    swipeStartTime = Date.now();
    swipeActive = true;
  }, { passive:true });

  view.addEventListener('touchend', e => {
    if (!swipeActive) return;
    swipeActive = false;
    const t = e.changedTouches[0];
    if (!t) return;
    const dx = t.clientX - swipeStartX;
    const dy = t.clientY - swipeStartY;
    const dt = Date.now() - swipeStartTime;
    if (dt > 600) return;
    if (Math.abs(dx) < 55) return;
    if (Math.abs(dy) > Math.abs(dx) * 0.8) return;

    const current = document.querySelector('.panel.active');
    if (!current) return;
    const currentKey = current.id.replace('panel-', '');
    const idx = PANEL_ORDER.indexOf(currentKey);
    if (idx < 0) return;

    let nextIdx = idx;
    if (dx < 0) nextIdx = Math.min(PANEL_ORDER.length - 1, idx + 1);
    else nextIdx = Math.max(0, idx - 1);
    if (nextIdx === idx) return;

    const nextKey = PANEL_ORDER[nextIdx];
    const btn = document.querySelector('.nav-btn[data-panel="' + nextKey + '"]');
    switchPanel(nextKey, btn);
    if (btn) {
      btn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
    }
  }, { passive:true });
}

function trimActiveSticker() {
  const l = textLayers.find(x => x.id === activeLayerId);
  if (!l || !l.isImage || !l.image) { alert('Select a sticker first'); return; }
  const im = l.image;
  const c = document.createElement('canvas');
  c.width = im.naturalWidth || im.width;
  c.height = im.naturalHeight || im.height;
  const cx = c.getContext('2d');
  cx.drawImage(im, 0, 0);
  const d = cx.getImageData(0, 0, c.width, c.height).data;
  let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
  for (let y = 0; y < c.height; y += 2) {
    for (let x = 0; x < c.width; x += 2) {
      const i = (y * c.width + x) * 4;
      const bright = (d[i] + d[i+1] + d[i+2]) / 3;
      if (bright < 200) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    }
  }
  if (minX >= maxX || minY >= maxY) { alert('Nothing to trim'); return; }
  const tw = maxX - minX, th = maxY - minY;
  const tc = document.createElement('canvas');
  tc.width = tw; tc.height = th;
  tc.getContext('2d').drawImage(c, minX, minY, tw, th, 0, 0, tw, th);
  const trimmed = new Image();
  trimmed.onload = () => { l.image = trimmed; l.height = Math.round(l.width * (th / tw)); redraw(); saveState(); };
  trimmed.src = tc.toDataURL('image/png');
}

async function removeBgFast() {
  if (!imgLoaded) { alert('Load a photo first'); return; }
  if (typeof SelfieSegmentation === 'undefined') { alert('Model not loaded'); return; }
  playCount(async () => {
    try {
      if (!selfieSeg) {
        selfieSeg = new SelfieSegmentation({ locateFile:f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/${f}` });
        selfieSeg.setOptions({ modelSelection:1 });
      }
      const result = await new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('Timed out')), 30000);
        selfieSeg.onResults(r => { clearTimeout(t); resolve(r); });
        selfieSeg.send({ image: img });
      });
      const c = document.createElement('canvas');
      c.width = canvas.width; c.height = canvas.height;
      const cx = c.getContext('2d');
      cx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const mask = document.createElement('canvas');
      mask.width = canvas.width; mask.height = canvas.height;
      const mctx = mask.getContext('2d');
      mctx.drawImage(result.segmentationMask, 0, 0, canvas.width, canvas.height);
      const id = mctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = id.data;
      for (let i = 0; i < d.length; i += 4) d[i+3] = d[i];
      mctx.putImageData(id, 0, 0);
      cx.globalCompositeOperation = 'destination-in';
      cx.drawImage(mask, 0, 0);
      const url = c.toDataURL('image/png');
      const newImg = new Image();
      newImg.onload = () => { img = newImg; originalImageSrc = url; imgLoaded = true; currentBgColor = '#ffffff'; buildBgColors(); redraw(); saveState(); };
      newImg.src = url;
    } catch (e) { alert('Fast failed: ' + e.message); }
  });
}

async function removeBgBest() {
  if (!imgLoaded) { alert('Load a photo first'); return; }

function timeAgo(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return 'Just now';
  if (diff < 3600) return Math.floor(diff/60) + ' min ago';
  if (diff < 86400) return Math.floor(diff/3600) + ' hr ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString();
}

/* ============================================================
   UNDO / REDO
   ============================================================ */

function saveState() {
  if (!imgLoaded) return;
  const state = canvas.toDataURL();
  if (state.length < 500) return;
  if (undoStack.length && undoStack[undoStack.length - 1] === state) return;
  undoStack.push(state);
  if (undoStack.length > 25) undoStack.shift();
  redoStack = [];
  updateHistoryButtons();
}

function undo() {
  if (undoStack.length > 1) {
    redoStack.push(undoStack.pop());
    const prev = undoStack[undoStack.length - 1];
    if (!prev || prev.length < 500) { updateHistoryButtons(); return; }
    const t = new Image();
    t.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(t, 0, 0); updateHistoryButtons(); };
    t.src = prev;
  }
}

function redo() {
  if (redoStack.length) {
    const nxt = redoStack.pop();
    undoStack.push(nxt);
    const t = new Image();
    t.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(t, 0, 0); updateHistoryButtons(); };
    t.src = nxt;
  }
}

function updateHistoryButtons() {
  const u = document.getElementById('undoBtn'); const r = document.getElementById('redoBtn');
  if (u) u.disabled = undoStack.length <= 1;
  if (r) r.disabled = redoStack.length === 0;
}

/* ============================================================
   TEXT LAYER INTERACTION
   ============================================================ */

function getCanvasCoordinates(e, touch) {
  const rect = canvas.getBoundingClientRect();
  const cx = touch ? touch.clientX : (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = touch ? touch.clientY : (e.touches ? e.touches[0].clientY : e.clientY);
  return { x:(cx-rect.left)*(canvas.width/rect.width), y:(cy-rect.top)*(canvas.height/rect.height) };
}

function touchDist(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }
function touchAngle(a,b) { return Math.atan2(b.y-a.y, b.x-a.x); }

canvas.addEventListener('mousedown', startTouch);
canvas.addEventListener('touchstart', startTouch, {passive:false});
canvas.addEventListener('mousemove', onTouchMove);
canvas.addEventListener('touchmove', onTouchMove, {passive:false});
canvas.addEventListener('mouseup', endTouch);
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);

function startTouch(e) {
  if (!imgLoaded || isCropPanelActive()) return;
  if (e.preventDefault) e.preventDefault();
  if (e.touches) { touches.clear(); for (const t of e.touches) touches.set(t.identifier, { x:t.clientX, y:t.clientY }); }
  else { touches.clear(); touches.set('mouse', { x:e.clientX, y:e.clientY }); }
  if (touches.size === 2) {
    const arr = Array.from(touches.values());
    if (activeLayerId !== null) {
      const l = textLayers.find(x => x.id === activeLayerId);
      if (l) { gesture = { type:'text', id:l.id, startDist:touchDist(arr[0],arr[1]), startAngle:touchAngle(arr[0],arr[1]), startSize:l.size||l.width||100, startRot:l.rotation||0 }; return; }
    }
    return;
  }
  if (touches.size !== 1) return;
  const pos = getCanvasCoordinates(e, e.touches ? e.touches[0] : null);
  let clickedLayer = null;
  for (let i = textLayers.length - 1; i >= 0; i--) {
    const layer = textLayers[i];
    if (layer.isImage) {
      const hw = layer.width / 2, hh = layer.height / 2;
      if (pos.x >= layer.x - hw - 10 && pos.x <= layer.x + hw + 10 && pos.y >= layer.y - hh - 10 && pos.y <= layer.y + hh + 10) { clickedLayer = layer; break; }
    } else {
      ctx.font = `bold ${layer.size}px '${layer.font}', sans-serif`;
      const m = ctx.measureText(layer.text);
      const w = m.width, h = parseInt(layer.size);
      if (pos.x >= layer.x - w/2 - 20 && pos.x <= layer.x + w/2 + 20 && pos.y >= layer.y - h && pos.y <= layer.y + 15) { clickedLayer = layer; break; }
    }
  }
  if (clickedLayer) {
    activeLayerId = clickedLayer.id;
    syncActiveInputs(); updateTextLayersUI();
    isDraggingText = true;
    showFloatingMenu(clickedLayer.x, clickedLayer.y);
    redraw();
  } else {
    activeLayerId = null; textMenu.style.display = 'none'; updateTextLayersUI(); redraw();
  }
}

function onTouchMove(e) {
  if (!imgLoaded || isCropPanelActive()) return;
  if (e.preventDefault) e.preventDefault();
  if (e.touches) { for (const t of e.touches) touches.set(t.identifier, { x:t.clientX, y:t.clientY }); }
  else if (touches.has('mouse')) { touches.set('mouse', { x:e.clientX, y:e.clientY }); }
  if (touches.size === 2 && gesture) {
    const arr = Array.from(touches.values());
    const scale = touchDist(arr[0], arr[1]) / gesture.startDist;
    const rotDelta = touchAngle(arr[0], arr[1]) - gesture.startAngle;
    if (gesture.type === 'text') {
      const l = textLayers.find(x => x.id === gesture.id);
      if (l) {
        if (l.isImage) { const newW = Math.max(20, Math.min(canvas.width*2, Math.round(gesture.startSize * scale))); const ratio = l.height / l.width; l.width = newW; l.height = Math.round(newW * ratio); l.size = newW; }
        else l.size = Math.max(8, Math.min(400, Math.round(gesture.startSize * scale)));
        l.rotation = gesture.startRot + rotDelta;
      }
    }
    redraw(); return;
  }
  const pos = getCanvasCoordinates(e, e.touches ? e.touches[0] : null);
  if (isDraggingText) {
    const l = textLayers.find(x => x.id === activeLayerId);
    if (l) { l.x = pos.x; l.y = pos.y; showFloatingMenu(l.x, l.y); redraw(); }
  }
}

function endTouch(e) {
  if (e && e.changedTouches) { for (const t of e.changedTouches) touches.delete(t.identifier); } else { touches.delete('mouse'); }
  if (touches.size < 2) gesture = null;
  if (isDraggingText) { isDraggingText = false; saveState(); syncActiveInputs(); }
}

function showFloatingMenu(x, y) {
  const rect = canvas.getBoundingClientRect();
  const contRect = canvas.parentElement.getBoundingClientRect();
  const ox = rect.left - contRect.left;
  const oy = rect.top - contRect.top;
  const sx = rect.width / canvas.width, sy = rect.height / canvas.height;
  textMenu.style.left = (ox + x * sx) + 'px';
  textMenu.style.top = (oy + y * sy - 30) + 'px';

}

function moveActiveText(dx, dy) {

  if (l) { l.x += dx; l.y += dy; showFloatingMenu(l.x, l.y); syncActiveInputs(); redraw(); saveState(); }

function centerActiveTextHoriz() {

function alignText(horiz, vert) {
  const l = textLayers.find(x => x.id === activeLayerId);
  if (!l) return;
  const margin = Math.min(canvas.width, canvas.height) * 0.12;
  const layerH = l.isImage ? l.height : (l.size || 40);
  const layerW = l.isImage ? l.width : (() => { ctx.font = `bold ${l.size}px '${l.font}', sans-serif`; return ctx.measureText(l.text || '').width; })();
  if (horiz === 'left')   l.x = layerW / 2 + margin;
  if (horiz === 'center') l.x = canvas.width / 2;
  if (horiz === 'right')  l.x = canvas.width - layerW / 2 - margin;
  if (vert === 'top')     l.y = layerH / 2 + margin;
  if (vert === 'middle')  l.y = canvas.height / 2;
  if (vert === 'bottom')  l.y = canvas.height - layerH / 2 - margin;
  showFloatingMenu(l.x, l.y); syncActiveInputs(); redraw(); saveState();
}

  });

}

function hexToHsl(hex) {
  hex = (hex || '#ffffff').replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const r = parseInt(hex.substr(0,2),16)/255, g = parseInt(hex.substr(2,2),16)/255, b = parseInt(hex.substr(4,2),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0, s = 0, l = (max+min)/2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    if (max === r) h = ((g-b)/d + (g<b?6:0)) / 6;
    else if (max === g) h = ((b-r)/d + 2) / 6;
    else h = ((r-g)/d + 4) / 6;
  }
  return { h: Math.round(h*360), s: Math.round(s*100), l: Math.round(l*100) };
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const toHex = x => { const v = Math.round(x*255).toString(16); return v.length === 1 ? '0'+v : v; };
  return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
}

function setActiveTextBrightness(v) {

}

function setActiveTextHue(v) {

  if (!l || l.isImage) return;
  const hsl = hexToHsl(l.color || '#ffffff');
  l.color = hslToHex(v, Math.max(hsl.s, 70), hsl.l);

}

function updateColorPreview() {

function syncActiveInputs() {
  const l = textLayers.find(x => x.id === activeLayerId);
  const px = document.getElementById('posX'), py = document.getElementById('posY');
  if (px) px.max = Math.max(2000, canvas.width * 1.2);
  if (py) py.max = Math.max(2000, canvas.height * 1.2);
  if (!l) {
    if (tInput) tInput.value = '';
    if (sizeInput) sizeInput.value = 36;
    const fs = document.getElementById('fSizeVal'); if (fs) fs.innerText = '36';
    const fr = document.getElementById('fontRotation'); if (fr) fr.value = 0;
    const frv = document.getElementById('fRotVal'); if (frv) frv.innerText = '0°';
    if (px) { px.value = 0; document.getElementById('posXVal').innerText = '0'; }
    if (py) { py.value = 0; document.getElementById('posYVal').innerText = '0'; }
    return;
  }
  if (px) { px.value = Math.round(l.x); document.getElementById('posXVal').innerText = Math.round(l.x); }
  if (py) { py.value = Math.round(l.y); document.getElementById('posYVal').innerText = Math.round(l.y); }
  if (l.isImage) {
    if (tInput) tInput.value = '';
    if (sizeInput) sizeInput.value = l.width || 100;
    const fs = document.getElementById('fSizeVal'); if (fs) fs.innerText = Math.round(l.width || 100);
  } else {
    if (tInput) tInput.value = l.text;
    if (sizeInput) sizeInput.value = l.size;
    const fs = document.getElementById('fSizeVal'); if (fs) fs.innerText = l.size;
    const cb = document.getElementById('colorBrightness');
    if (cb) {
      const hsl = hexToHsl(l.color || '#ffffff');
      cb.value = hsl.l; document.getElementById('brVal').innerText = hsl.l;
      document.getElementById('colorHue').value = hsl.h; document.getElementById('hueVal').innerText = hsl.h + '°';
      updateColorPreview();
    }
  }
  const fr = document.getElementById('fontRotation');
  if (fr) { const deg = Math.round((l.rotation || 0) * 180 / Math.PI); fr.value = deg; document.getElementById('fRotVal').innerText = deg + '°'; }
}

function setActiveTextColor(c, el) { const l = textLayers.find(x => x.id === activeLayerId); updateSelection(el); if (!l || l.isImage) return; l.color = c; syncActiveInputs(); redraw(); saveState(); }

function saveProjectToHome() {
  if (!imgLoaded) return;
  if (!currentProjectId) currentProjectId = 'proj_' + Date.now();
  const serializedLayers = textLayers.map(l => {
    if (l.isImage) return { id:l.id, isImage:true, imageUrl:l.imageUrl, x:l.x, y:l.y, width:l.width, height:l.height, rotation:l.rotation, size:l.size };
    return l;
  });
  let bgFile = null;
  if (currentBgImage) { for (const f of BG_CONFIG.files) if (bgImages[f.fname] === currentBgImage) { bgFile = f.fname; break; } }
  const now = new Date();
  let autoName = currentProjectName;
  if (!autoName || autoName.startsWith('Cover ')) {
    const firstText = textLayers.find(l => !l.isImage && l.text && l.text.trim());
    autoName = firstText ? firstText.text.trim().slice(0, 24) : (currentProjectName || 'Cover');
  }
  try {
    localStorage.setItem('music_' + currentProjectId, JSON.stringify({
      name: autoName, date: now.toISOString(), savedAt: now.getTime(),
      image: canvas.toDataURL('image/jpeg', 0.85),
      originalImage: originalImageSrc,
      canvasW: canvas.width, canvasH: canvas.height,
      textLayers: serializedLayers,
      brightness: bInput.value, contrast: cInput.value, saturation: sInput.value, noise: nInput.value,
      filter: currentFilter, border: currentBorder, borderColor: currentBorderColor, borderSize: currentBorderSize,
      bgColor: currentBgColor, bgColorSize: currentBgColorSize,
      bgImageFile: bgFile, bgImageSize: currentBgImageSize,
      bgImageZoom: currentBgImageZoom, bgImageX: currentBgImageX, bgImageY: currentBgImageY,
      template: currentTemplate,
      subjectMode, strokeColor, subjectAmount: subjAmt.value
    }));
  } catch(e) { alert('Storage full.'); return; }
  undoStack = []; redoStack = []; updateHistoryButtons();
  playCount(() => { goHome(); });
}

function saveImage() {
  if (!imgLoaded) return;
  const dataUrl = canvas.toDataURL('image/png');
  playCount(() => {
    const a = document.createElement('a');
    a.download = 'mx-studio-' + Date.now() + '.png';
    a.href = dataUrl;
    a.click();
  });
}

/* ============================================================
   CROP
   ============================================================ */

function showCropOverlay(show) {
  const ov = document.getElementById('cropOverlay');
  if (show && imgLoaded) { ov.classList.add('active'); crop = { x:0, y:0, w:1, h:1 }; updateCropBox(); }
  else { ov.classList.remove('active'); }
}

function updateCropBox() {
  const box = document.getElementById('cropBox');
  const rect = canvas.getBoundingClientRect();
  const contRect = canvas.parentElement.getBoundingClientRect();
  const ox = rect.left - contRect.left;
  const oy = rect.top - contRect.top;
  box.style.left = (ox + rect.width * crop.x) + 'px';
  box.style.top = (oy + rect.height * crop.y) + 'px';
  box.style.width = (rect.width * crop.w) + 'px';
  box.style.height = (rect.height * crop.h) + 'px';
}

function initCropOverlay() {
  const box = document.getElementById('cropBox');
  if (!box) return;
  box.addEventListener('pointerdown', e => {
    if (!isCropPanelActive()) return;
    e.preventDefault(); e.stopPropagation();
    const isCorner = e.target.classList.contains('crop-corner');
    const corner = isCorner ? e.target.dataset.corner : null;
    const rect = canvas.getBoundingClientRect();
    cropDrag = { type:corner||'move', startX:e.clientX, startY:e.clientY, start:{...crop}, canvasRect:rect };
  });
  window.addEventListener('pointermove', e => {
    if (!cropDrag) return;
    e.preventDefault();
    const dx = (e.clientX - cropDrag.startX) / cropDrag.canvasRect.width;
    const dy = (e.clientY - cropDrag.startY) / cropDrag.canvasRect.height;
    const s = cropDrag.start; const MIN = 0.15;
    let { x, y, w, h } = s;
    if (cropDrag.type === 'move') { x = Math.max(0, Math.min(1-s.w, s.x+dx)); y = Math.max(0, Math.min(1-s.h, s.y+dy)); }
    else if (cropDrag.type === 'tl') { const nx = Math.max(0, Math.min(s.x+s.w-MIN, s.x+dx)); const ny = Math.max(0, Math.min(s.y+s.h-MIN, s.y+dy)); x=nx; y=ny; w=s.x+s.w-nx; h=s.y+s.h-ny; }
    else if (cropDrag.type === 'tr') { const ny = Math.max(0, Math.min(s.y+s.h-MIN, s.y+dy)); y=ny; h=s.y+s.h-ny; w=Math.max(MIN, Math.min(1-s.x, s.w+dx)); }
    else if (cropDrag.type === 'bl') { const nx = Math.max(0, Math.min(s.x+s.w-MIN, s.x+dx)); x=nx; w=s.x+s.w-nx; h=Math.max(MIN, Math.min(1-s.y, s.h+dy)); }
    else if (cropDrag.type === 'br') { w=Math.max(MIN, Math.min(1-s.x, s.w+dx)); h=Math.max(MIN, Math.min(1-s.y, s.h+dy)); }
    crop = { x, y, w, h };
    updateCropBox();
  });
  window.addEventListener('pointerup', () => { cropDrag = null; });
  window.addEventListener('pointercancel', () => { cropDrag = null; });
  window.addEventListener('resize', () => { if (isCropPanelActive()) updateCropBox(); });
}

function setCropRect(ratio) {
  if (ratio === 'free') { crop = { x:0, y:0, w:1, h:1 }; updateCropBox(); return; }
  let tr;
  if (ratio === '1:1') tr = 1;
  else if (ratio === '4:5') tr = 4/5;
  else if (ratio === '9:16') tr = 9/16;
  else if (ratio === '16:9') tr = 16/9;
  const ca = canvas.width / canvas.height;
  const cr = tr / ca;
  let w, h;
  if (cr >= 1) { w = 1; h = 1/cr; } else { h = 1; w = cr; }
  crop = { x:(1-w)/2, y:(1-h)/2, w, h };
  updateCropBox();
}

function resetCrop() { crop = { x:0, y:0, w:1, h:1 }; updateCropBox(); }

function applyCropNow() {
  if (!imgLoaded) return;
  if (crop.w >= 0.99 && crop.h >= 0.99 && crop.x < 0.01 && crop.y < 0.01) return;
  const px = Math.round(crop.x * canvas.width);
  const py = Math.round(crop.y * canvas.height);
  const pw = Math.round(crop.w * canvas.width);
  const ph = Math.round(crop.h * canvas.height);
  const full = document.createElement('canvas');
  full.width = canvas.width; full.height = canvas.height;
  full.getContext('2d').drawImage(img, 0, 0);
  const tmp = document.createElement('canvas');
  tmp.width = pw; tmp.height = ph;
  tmp.getContext('2d').drawImage(full, px, py, pw, ph, 0, 0, pw, ph);
  const url = tmp.toDataURL('image/png');
  const newImg = new Image();
  newImg.onload = function() {
    img = newImg; originalImageSrc = url;
    canvas.width = pw; canvas.height = ph;
    personMask = null; subjectReady = false;
    crop = { x:0, y:0, w:1, h:1 };
    buildFilterThumbs(); buildTemplates();
    redraw(); saveState();
    showCropOverlay(false);
    switchPanel('adjust', document.querySelector('.nav-btn[data-panel="adjust"]'));
  };
  newImg.src = url;
}

function rotateImage(deg) {
  if (!imgLoaded) return;
  const c = document.createElement('canvas');
  c.width = canvas.height; c.height = canvas.width;
  const cx = c.getContext('2d');
  cx.translate(c.width/2, c.height/2);
  cx.rotate(deg * Math.PI / 180);
  cx.drawImage(img, -canvas.width/2, -canvas.height/2);
  const url = c.toDataURL('image/png');
  const newImg = new Image();
  newImg.onload = function() {
    img = newImg; originalImageSrc = url;
    canvas.width = c.width; canvas.height = c.height;
    redraw(); saveState(); buildFilterThumbs(); buildTemplates();
    if (isCropPanelActive()) { crop = { x:0, y:0, w:1, h:1 }; updateCropBox(); }
  };
  newImg.src = url;
}

function flipImage(dir) {
  if (!imgLoaded) return;
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const cx = c.getContext('2d');
  cx.translate(dir === 'h' ? canvas.width : 0, dir === 'v' ? canvas.height : 0);
  cx.scale(dir === 'h' ? -1 : 1, dir === 'v' ? -1 : 1);
  cx.drawImage(img, 0, 0);
  const url = c.toDataURL('image/png');
  const newImg = new Image();
  newImg.onload = function() { img = newImg; originalImageSrc = url; redraw(); saveState(); buildFilterThumbs(); buildTemplates(); };
  newImg.src = url;
}

/* ============================================================
   SUBJECT DETECTION
   ============================================================ */

window.detectSubject = async function() {
  const status = document.getElementById('subjectStatus');
  const btn = document.getElementById('detectBtn');
  if (!imgLoaded) { status.textContent = 'Upload an image first.'; return; }
  if (typeof SelfieSegmentation === 'undefined') { status.textContent = 'Model failed to load.'; return; }
  btn.disabled = true; status.textContent = 'Loading model...';
  try {
    if (!selfieSeg) {
      selfieSeg = new SelfieSegmentation({ locateFile:f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/${f}` });
      selfieSeg.setOptions({ modelSelection:1 });
    }
    status.textContent = 'Analysing photo...';
    const result = await new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error('Timed out.')), 30000);
      selfieSeg.onResults(r => { clearTimeout(t); resolve(r); });
      selfieSeg.send({ image: img });
    });
    const raw = document.createElement('canvas');
    raw.width = canvas.width; raw.height = canvas.height;
    const rctx = raw.getContext('2d');
    rctx.drawImage(result.segmentationMask, 0, 0, canvas.width, canvas.height);
    const id = rctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) d[i+3] = d[i];
    rctx.putImageData(id, 0, 0);
    const soft = document.createElement('canvas');
    soft.width = canvas.width; soft.height = canvas.height;
    const sctx = soft.getContext('2d');
    sctx.filter = 'blur(3px)';
    sctx.drawImage(raw, 0, 0);
    personMask = soft; subjectReady = true;
    status.textContent = 'Subject detected. Pick Blur or Stroke below.';
    btn.textContent = 'RE-DETECT'; btn.disabled = false;
    redraw(); saveState();
  } catch(err) { status.textContent = 'Failed: ' + err.message; btn.disabled = false; }
};

/* ============================================================
   BORDER / COVER / SELECTION
   ============================================================ */

function drawBorder() {
  if (!imgLoaded || currentBorder === 'none') return;
  const w = canvas.width, h = canvas.height;
  const base = Math.min(w, h);
  const col = currentBorderColor;
  const pct = currentBorderSize / 100;
  if (currentBorder === 'white') {
    const t = Math.round(base * pct);
    ctx.fillStyle = col;
    ctx.fillRect(0,0,w,t); ctx.fillRect(0,h-t,w,t); ctx.fillRect(0,0,t,h); ctx.fillRect(w-t,0,t,h);
  } else if (currentBorder === 'black') {
    const t = Math.round(base * pct * 1.6);
    ctx.fillStyle = col;
    ctx.fillRect(0,0,w,t); ctx.fillRect(0,h-t,w,t); ctx.fillRect(0,0,t,h); ctx.fillRect(w-t,0,t,h);
  } else if (currentBorder === 'rounded') {
    const t = Math.round(base * pct); const r = Math.round(base * pct * 1.6);
    ctx.save(); ctx.fillStyle = col;
    ctx.beginPath(); ctx.rect(0,0,w,h);
    ctx.moveTo(t+r, t); ctx.lineTo(w-t-r, t); ctx.quadraticCurveTo(w-t, t, w-t, t+r);
    ctx.lineTo(w-t, h-t-r); ctx.quadraticCurveTo(w-t, h-t, w-t-r, h-t);
    ctx.lineTo(t+r, h-t); ctx.quadraticCurveTo(t, h-t, t, h-t-r);
    ctx.lineTo(t, t+r); ctx.quadraticCurveTo(t, t, t+r, t);
    ctx.closePath(); ctx.fill('evenodd'); ctx.restore();
  } else if (currentBorder === 'polaroid') {
    const side = Math.round(base * pct); const bottom = Math.round(base * pct * 3.4);
    ctx.fillStyle = col;
    ctx.fillRect(0,0,w,side); ctx.fillRect(0,0,side,h); ctx.fillRect(w-side,0,side,h); ctx.fillRect(0,h-bottom,w,bottom);
  } else if (currentBorder === 'shadow') {
    const grad = ctx.createRadialGradient(w/2, h/2, base*0.25, w/2, h/2, Math.max(w,h)*0.75);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${0.4 + pct * 3})`);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
  }
}

function drawCover(x, y, w, h, im) {
  const sr = im.naturalWidth / im.naturalHeight;
  const dr = w / h;
  let sx = 0, sy = 0, sw = im.naturalWidth, sh = im.naturalHeight;
  if (sr > dr) { sw = sh * dr; sx = (im.naturalWidth - sw) / 2; }
  else { sh = sw / dr; sy = (im.naturalHeight - sh) / 2; }
  ctx.drawImage(im, sx, sy, sw, sh, x, y, w, h);
}

function drawSelectionBox(bx, by, bw, bh) {
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx+bw, by, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx, by+bh, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(bx+bw, by+bh, 5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath(); ctx.moveTo(bx + bw/2, by); ctx.lineTo(bx + bw/2, by - 26); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(bx + bw/2, by - 30, 6, 0, Math.PI*2); ctx.fill();
}

/* ============================================================
   MAIN REDRAW
   ============================================================ */

function redraw() {
  if (!imgLoaded) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let filterString = `brightness(${bInput.value}%) contrast(${cInput.value}%) saturate(${sInput.value}%) `;
  if (currentFilter !== 'none') filterString += currentFilter;
  const OVER = 6;
  const photoLayer = document.createElement('canvas');
  photoLayer.width = canvas.width; photoLayer.height = canvas.height;
  const plctx = photoLayer.getContext('2d');
  if (subjectReady && personMask && subjectMode !== 'none') {
    const amt = parseInt(subjAmt.value);
    const blurred = document.createElement('canvas');
    blurred.width = canvas.width; blurred.height = canvas.height;
    const bctx = blurred.getContext('2d');
    bctx.filter = filterString + ` blur(${amt}px)`;
    bctx.drawImage(img, -OVER, -OVER, canvas.width+OVER*2, canvas.height+OVER*2);
    const person = document.createElement('canvas');
    person.width = canvas.width; person.height = canvas.height;
    const pctx = person.getContext('2d');
    pctx.filter = filterString;
    pctx.drawImage(img, -OVER, -OVER, canvas.width+OVER*2, canvas.height+OVER*2);
    pctx.globalCompositeOperation = 'destination-in';
    pctx.drawImage(personMask, 0, 0);
    if (subjectMode === 'blur') { plctx.drawImage(blurred, 0, 0); plctx.drawImage(person, 0, 0); }
    else if (subjectMode === 'stroke') {
      const sharp = document.createElement('canvas');
      sharp.width = canvas.width; sharp.height = canvas.height;
      const sctx = sharp.getContext('2d');
      sctx.filter = filterString;
      sctx.drawImage(img, -OVER, -OVER, canvas.width+OVER*2, canvas.height+OVER*2);
      plctx.drawImage(sharp, 0, 0);
      const ring = document.createElement('canvas');
      ring.width = canvas.width; ring.height = canvas.height;
      const rctx = ring.getContext('2d');
      const offset = Math.max(3, amt);
      for (let a2 = 0; a2 < 360; a2 += 10) {
        const rad = a2 * Math.PI / 180;
        rctx.drawImage(personMask, Math.cos(rad) * offset, Math.sin(rad) * offset);
      }
      rctx.globalCompositeOperation = 'destination-out';
      rctx.drawImage(personMask, 0, 0);
      rctx.globalCompositeOperation = 'source-in';
      rctx.fillStyle = strokeColor;
      rctx.fillRect(0, 0, canvas.width, canvas.height);
      plctx.drawImage(ring, 0, 0);
      plctx.drawImage(person, 0, 0);
    }
  } else {
    plctx.filter = filterString;
    plctx.drawImage(img, -OVER, -OVER, canvas.width+OVER*2, canvas.height+OVER*2);
    plctx.filter = 'none';
  }
  if (currentBgImage) {
    const w = canvas.width, h = canvas.height;
    const zoom = currentBgImageZoom / 100;
    const offsetX = (currentBgImageX / 100) * w * 0.5;
    const offsetY = (currentBgImageY / 100) * h * 0.5;
    const scaledW = w * zoom;
    const scaledH = h * zoom;
    const dx = (w - scaledW) / 2 + offsetX;
    const dy = (h - scaledH) / 2 + offsetY;
    drawCover(dx, dy, scaledW, scaledH, currentBgImage);
    const pad = Math.round(Math.min(canvas.width, canvas.height) * (currentBgImageSize / 100));
    ctx.drawImage(photoLayer, 0, 0, canvas.width, canvas.height, pad, pad, canvas.width - pad*2, canvas.height - pad*2);
  } else if (currentBgColor) {
    ctx.fillStyle = currentBgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const pad = Math.round(Math.min(canvas.width, canvas.height) * (currentBgColorSize / 100));
    ctx.drawImage(photoLayer, 0, 0, canvas.width, canvas.height, pad, pad, canvas.width - pad*2, canvas.height - pad*2);
  } else {
    ctx.drawImage(photoLayer, 0, 0);
  }
  const fade = parseInt(nInput.value);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${(fade/100)*0.4})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  if (!currentBgColor && !currentBgImage) drawBorder();
  textLayers.forEach(layer => {
    if (layer.isImage && layer.image && layer.image.complete) {
      ctx.save();
      ctx.translate(layer.x, layer.y);
      if (layer.rotation) ctx.rotate(layer.rotation);
      const w = layer.width, h = layer.height;
      ctx.drawImage(layer.image, -w/2, -h/2, w, h);
      if (activeLayerId === layer.id) drawSelectionBox(-w/2 - 4, -h/2 - 4, w + 8, h + 8);
      ctx.restore();
    } else if (layer.text && layer.text.trim() !== '') {
      ctx.save();
      ctx.translate(layer.x, layer.y);
      if (layer.rotation) ctx.rotate(layer.rotation);
      ctx.font = `bold ${layer.size}px '${layer.font}', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (layer.style === 'stroke') { ctx.lineWidth = Math.max(2, layer.size * 0.08); ctx.strokeStyle = '#000'; ctx.strokeText(layer.text, 0, 0); }
      else if (layer.style === 'shadow') { ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 12; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4; }
      else if (layer.style === 'glow') { ctx.shadowColor = layer.color; ctx.shadowBlur = 20; }
      ctx.fillStyle = layer.color;
      ctx.fillText(layer.text, 0, 0);
      if (activeLayerId === layer.id) {
        const m = ctx.measureText(layer.text);
        const bw = m.width + 16, bh = layer.size + 8;
        drawSelectionBox(-bw/2, -bh/2, bw, bh);
      }
      ctx.restore();
    }
  });
}

/* ============================================================
   UPLOAD / IMPORT
   ============================================================ */

function initHomeUpload() {
  document.getElementById('homeImageUpload').addEventListener('change', async function(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    e.target.value = '';
    let overlay = document.getElementById('importOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'importOverlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:14px;';
      overlay.innerHTML = '<div id="importCount" style="margin-bottom:12px;">Importing...</div><div style="width:180px;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;"><div id="importBar" style="height:100%;width:0;background:#fff;transition:width .2s;"></div></div>';
      document.body.appendChild(overlay);
    }
    overlay.style.display = 'flex';
    let done = 0;
    for (const file of files) {
      await importOnePhoto(file); done++;
      document.getElementById('importBar').style.width = Math.round((done / files.length) * 100) + '%';
      document.getElementById('importCount').textContent = 'Importing ' + done + ' / ' + files.length;
    }
    overlay.style.display = 'none';
    renderProjectsList();
  });
}

function importOnePhoto(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const newImg = new Image();
      newImg.onload = function() {
        const MAX = 1080; let w = newImg.width, h = newImg.height;
        if (w > MAX || h > MAX) { const s = MAX / Math.max(w, h); w = Math.round(w*s); h = Math.round(h*s); }
        const tmp = document.createElement('canvas');
        tmp.width = w; tmp.height = h;
        tmp.getContext('2d').drawImage(newImg, 0, 0, w, h);
        const dataURL = tmp.toDataURL('image/jpeg', 0.85);
        const id = 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        const now = new Date();
        try {
          localStorage.setItem('music_' + id, JSON.stringify({
            name: 'Cover ' + (Object.keys(localStorage).filter(k => k.startsWith('music_proj_')).length + 1),
            date: now.toISOString(), savedAt: now.getTime(),
            image: dataURL, originalImage: dataURL,
            canvasW: w, canvasH: h, textLayers: [],
            brightness: 100, contrast: 100, saturation: 100, noise: 0,
            filter: 'none', border: 'none', borderColor: '#ffffff', borderSize: 5,
            bgColor: null, bgColorSize: 8, template: 'none',
            subjectMode: 'none', strokeColor: '#ffffff', subjectAmount: 12,
            bgImageFile: null, bgImageSize: 8,
            bgImageZoom: 100, bgImageX: 0, bgImageY: 0
          }));
        } catch(err) {}
        resolve();
      };
      newImg.onerror = () => resolve();
      newImg.src = ev.target.result;
    };
    reader.onerror = () => resolve();
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   LOAD / HOME
   ============================================================ */

function loadProject(key) {
  resetStudioState();
  const p = JSON.parse(localStorage.getItem(key));
  currentProjectId = key.replace('music_', '');
  currentProjectName = p.name || 'Untitled';
  textLayers = p.textLayers || [];
  activeLayerId = null;
  textLayers.forEach(l => { if (l.isImage && l.imageUrl) { const im = new Image(); im.src = l.imageUrl; l.image = im; } });
  bInput.value = p.brightness ?? 100; cInput.value = p.contrast ?? 100; sInput.value = p.saturation ?? 100; nInput.value = p.noise ?? 0;
  subjAmt.value = p.subjectAmount ?? 12;
  currentFilter = p.filter ?? 'none';
  currentBorder = p.border ?? 'none'; currentBorderColor = p.borderColor ?? '#ffffff'; currentBorderSize = p.borderSize ?? 5;
  currentBgColor = p.bgColor ?? null; currentBgColorSize = p.bgColorSize ?? 8;
  currentBgImageSize = p.bgImageSize ?? 8;
  currentBgImageZoom = p.bgImageZoom ?? 100;
  currentBgImageX = p.bgImageX ?? 0;
  currentBgImageY = p.bgImageY ?? 0;
  const zIn = document.getElementById('bgImgZoomInput'); if (zIn) zIn.value = currentBgImageZoom;
  const zV = document.getElementById('bgImgZoomVal'); if (zV) zV.innerText = currentBgImageZoom;
  const xIn = document.getElementById('bgImgXInput'); if (xIn) xIn.value = currentBgImageX;
  const xV = document.getElementById('bgImgXVal'); if (xV) xV.innerText = currentBgImageX;
  const yIn = document.getElementById('bgImgYInput'); if (yIn) yIn.value = currentBgImageY;
  const yV = document.getElementById('bgImgYVal'); if (yV) yV.innerText = currentBgImageY;
  currentBgImage = (p.bgImageFile && bgImages[p.bgImageFile]) ? bgImages[p.bgImageFile] : null;
  const bsi = document.getElementById('borderSizeInput'); if (bsi) bsi.value = currentBorderSize;
  const bsv = document.getElementById('borderSizeVal'); if (bsv) bsv.innerText = currentBorderSize;
  const bcsi = document.getElementById('bgColorSizeInput'); if (bcsi) bcsi.value = currentBgColorSize;
  const bcsv = document.getElementById('bgColorSizeVal'); if (bcsv) bcsv.innerText = currentBgColorSize;
  const bgsi = document.getElementById('bgImgSizeInput'); if (bgsi) bgsi.value = currentBgImageSize;
  const bgsv = document.getElementById('bgImgSizeVal'); if (bgsv) bgsv.innerText = currentBgImageSize;
  currentTemplate = p.template ?? 'none';
  subjectMode = p.subjectMode ?? 'none'; strokeColor = p.strokeColor ?? '#ffffff';
  const sourceImage = p.originalImage || p.image;
  originalImageSrc = sourceImage;
  img.onload = function() {
    if (p.canvasW && p.canvasH) { canvas.width = p.canvasW; canvas.height = p.canvasH; } else setupCanvasFromImage(img);
    imgLoaded = true;
    buildFilterThumbs(); buildTemplates(); buildBorders(); buildBgColors();
    buildAdvisoryGrid(); buildBgImageGrid();
    saveState(); redraw();
  };
  img.src = sourceImage;
  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-studio').classList.add('active');
  document.getElementById('cropOverlay').classList.remove('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-adjust').classList.add('active');
  document.querySelector('.nav-btn[data-panel="adjust"]').classList.add('active');
}

function goHome() {
  document.getElementById('view-studio').classList.remove('active');
  document.getElementById('view-home').classList.add('active');
  textMenu.style.display = 'none';
  document.getElementById('cropOverlay').classList.remove('active');
  resetStudioState();
  renderProjectsList();
}

function resetEverything() {
  bInput.value = 100; cInput.value = 100; sInput.value = 100; nInput.value = 0;
  currentFilter = 'none'; currentBorder = 'none'; currentBgColor = null; currentBgImage = null;
  currentBgImageZoom = 100; currentBgImageX = 0; currentBgImageY = 0;
  textLayers = []; activeLayerId = null;
  subjectMode = 'none'; personMask = null; subjectReady = false;
  document.querySelectorAll('.template-thumb, .filter-thumb, .border-thumb, .bgcolor-swatch, .bg-item').forEach(c => c.classList.remove('selected'));
  syncActiveInputs(); updateTextLayersUI(); redraw(); saveState();
}

/* ============================================================
   BOOT
   ============================================================ */

window.onload = function() {
  const el = document.getElementById('splashScreen');
  if (el) { el.classList.remove('fade-out'); el.style.display = 'flex'; }
  (async () => {
    buildFontGrid(); buildTemplates(); buildBorders(); buildBgColors();
    updateTextLayersUI(); initCropOverlay(); initSwipeGestures(); initHomeUpload(); renderProjectsList();
    try { if (typeof preloadEffects === 'function') await preloadEffects(); } catch (e) { console.warn(e); }
    setTimeout(() => {
      const s = document.getElementById('splashScreen');
      if (s) { s.classList.add('fade-out'); setTimeout(() => { s.style.display = 'none'; }, 400); }
    }, 1200);
  })();
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW failed', e));
  });
}
