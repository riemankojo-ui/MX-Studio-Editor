<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mx Studio</title>
<link rel="manifest" href="./manifest2.json">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Audiowide&family=Alfa+Slab+One&family=Bebas+Neue&family=Bungee&family=Creepster&family=Monoton&family=Orbitron:wght@900&family=Pacifico&family=Permanent+Marker&family=Righteous&family=Russo+One&family=Sigmar+One&family=Titan+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="home-active">

<div id="splashScreen">
  <div class="splash-inner">
    <svg width="48" height="48" viewBox="0 0 90 90" style="transform:rotate(-90deg);">
      <circle cx="45" cy="45" r="38" fill="none" stroke="#0a0a0a" stroke-width="7"/>
      <circle id="splashRing" cx="45" cy="45" r="38" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="238.76"/>
    </svg>
  </div>
</div>

<div id="view-home" class="view active">
  <div class="home-container">
    <div id="gallery" class="gallery"></div>
  </div>
  <input type="file" id="homeImageUpload" accept="image/*" multiple style="display:none;">
</div>

<div id="confirmModal">
  <div class="confirm-card">
    <div class="confirm-title">Delete this project?</div>
    <div class="confirm-sub">This can't be undone.</div>
    <div class="confirm-actions">
      <button class="confirm-btn keep" onclick="closeConfirm()">Keep</button>
      <button class="confirm-btn delete" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<div id="toast">Saved</div>

<script src="app.js"></script>
</body>
</html>
